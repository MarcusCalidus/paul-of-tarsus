<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paul of Tarsus: The Roman Road Runner</title>
<style>
:root{--s:3;--gold:#e2b24c;--hi:#fff3b8;--dim:#8a6628;--ink:#0b0812;--pray:#a8d0f8;--px:calc(var(--s)*.5px);--wood:none}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#ddd;overflow:hidden;
  font-family:"Lucida Console",Monaco,"Courier New",monospace;font-weight:bold;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center}
#wrap{width:calc(var(--s)*320px);background:#0a0706}
#top,#status,#panel{background:#1c130c var(--wood);background-size:calc(var(--s)*128px) calc(var(--s)*32px);image-rendering:pixelated}
#top{display:flex;justify-content:space-between;align-items:center;height:calc(var(--s)*10px);
  padding:0 calc(var(--s)*3px);font-size:calc(var(--s)*5px);color:#b08a48;letter-spacing:.08em;text-shadow:var(--px) var(--px) 0 #000;
  box-shadow:inset 0 calc(var(--px)*-1) 0 #000,inset 0 calc(var(--px)*-2) 0 #6a4c24}
#top button{font:inherit;color:var(--gold);background:rgba(10,6,4,.55);border:var(--px) solid var(--dim);text-shadow:inherit;
  padding:0 calc(var(--s)*3px);height:calc(var(--s)*8px);cursor:pointer}
#top button:hover{color:var(--hi);border-color:var(--gold)}
#view{position:relative;width:calc(var(--s)*320px);height:calc(var(--s)*144px);overflow:hidden;cursor:crosshair}
#screen{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#speech{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:3}
.line{position:absolute;transform:translateX(-50%);text-align:center;width:max-content;
  max-width:calc(var(--s)*200px);font-size:calc(var(--s)*6.2px);line-height:1.25;
  text-shadow:calc(var(--s)*1px) 0 #000,calc(var(--s)*-1px) 0 #000,0 calc(var(--s)*1px) #000,0 calc(var(--s)*-1px) #000,
   calc(var(--s)*1px) calc(var(--s)*1px) #000,calc(var(--s)*-1px) calc(var(--s)*1px) #000,calc(var(--s)*1px) calc(var(--s)*-1px) #000,calc(var(--s)*-1px) calc(var(--s)*-1px) #000}
#dim{position:absolute;z-index:2;inset:0;background:#05030c;opacity:0;pointer-events:none;transition:opacity .9s}
#overlay{position:absolute;z-index:4;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:calc(var(--s)*8px);cursor:pointer}
#overlay.on{display:flex}
#overlay h1{margin:0;font-size:calc(var(--s)*17px);line-height:1;color:var(--gold);letter-spacing:.04em;
  text-shadow:0 calc(var(--s)*1px) #7a3b12,0 calc(var(--s)*2px) #3a1608,calc(var(--s)*2px) calc(var(--s)*3px) #000}
#overlay h2{margin:calc(var(--s)*3px) 0;font-size:calc(var(--s)*8px);color:#f0e2c0;letter-spacing:.2em;
  text-shadow:calc(var(--s)*1px) calc(var(--s)*1px) #000}
#overlay p{margin:calc(var(--s)*2px) 0;font-size:calc(var(--s)*5.4px);line-height:1.35;color:#d8cfe8;
  max-width:calc(var(--s)*270px);text-shadow:calc(var(--s)*1px) calc(var(--s)*1px) #000}
#overlay .small{font-size:calc(var(--s)*4.4px);color:#a99cc0}
#overlay .go{color:var(--hi);animation:bl 1.1s steps(2) infinite}
#overlay .go,#overlay .pick{font-size:calc(var(--s)*6.2px);margin:calc(var(--s)*2.5px) 0}
#overlay .pick{color:var(--gold)}
#overlay .pick:hover{color:#fff}
#overlay.end{background:rgba(6,4,14,.82)}
@keyframes bl{50%{opacity:.25}}
#status{height:calc(var(--s)*11px);line-height:calc(var(--s)*11px);text-align:center;
  font-size:calc(var(--s)*6.2px);color:var(--hi);white-space:nowrap;overflow:hidden;text-shadow:var(--px) var(--px) 0 #000;background-blend-mode:multiply;background-color:#5a4630;
  border-top:calc(var(--s)*1px) solid #6a4c24;border-bottom:calc(var(--s)*1px) solid #0a0604;box-shadow:inset 0 var(--px) 0 #000}
#panel{display:flex;height:calc(var(--s)*53px);padding:calc(var(--s)*2px);gap:calc(var(--s)*3px);position:relative}
#verbs{width:46%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:calc(var(--s)*1px)}
#verbs button,#choices button{font:inherit;font-size:calc(var(--s)*6.2px);color:var(--gold);background:rgba(14,8,5,.62);
  border:0;cursor:pointer;padding:0;text-align:center;text-shadow:var(--px) var(--px) 0 #000;
  box-shadow:inset var(--px) var(--px) 0 rgba(255,214,140,.26),inset calc(var(--px)*-1) calc(var(--px)*-1) 0 rgba(0,0,0,.7)}
#verbs button:hover{color:var(--hi);background:rgba(96,62,28,.6)}
#verbs button.sel{color:#fff;background:rgba(168,98,30,.66);box-shadow:inset var(--px) var(--px) 0 rgba(0,0,0,.6),inset calc(var(--px)*-1) calc(var(--px)*-1) 0 rgba(255,214,140,.3)}
#verbs #pray{grid-column:1/4;color:var(--pray);background:rgba(14,32,70,.78);letter-spacing:.06em}
#verbs #pray:hover{color:#fff;background:rgba(30,60,116,.82)}
#inv{flex:1;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);gap:calc(var(--s)*1px)}
#inv .slot{background:rgba(8,5,4,.66);display:flex;align-items:center;justify-content:center;cursor:pointer;outline:0 solid var(--gold);
  box-shadow:inset var(--px) var(--px) 0 rgba(0,0,0,.75),inset calc(var(--px)*-1) calc(var(--px)*-1) 0 rgba(255,214,140,.2)}
#inv .slot:hover{background:rgba(96,62,28,.5)}
#inv .slot.sel{outline-width:calc(var(--s)*1px);outline-offset:calc(var(--s)*-1px);background:rgba(168,98,30,.5)}
#inv canvas{height:calc(var(--s)*24px);width:calc(var(--s)*24px);image-rendering:pixelated;image-rendering:crisp-edges;pointer-events:none}
#choices{position:absolute;inset:calc(var(--s)*2px);display:none;flex-direction:column;gap:calc(var(--s)*1px);
  background:#120c08;overflow:auto}
#choices.on{display:flex}
#choices button{text-align:left;padding:0 calc(var(--s)*4px);flex:0 0 calc(var(--s)*7.6px);line-height:calc(var(--s)*7.6px);font-size:calc(var(--s)*5.4px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#choices button:hover{color:var(--hi);background:rgba(96,62,28,.6)}
#panel.locked #verbs,#panel.locked #inv{opacity:.35;pointer-events:none}
#top button{margin-left:calc(var(--s)*2px)}
#codebox{position:absolute;z-index:5;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--s)*3px);
  background:rgba(6,4,14,.92);text-align:center;cursor:default;padding:calc(var(--s)*8px)}
#codebox.on{display:flex}
#codebox h2{margin:0;font-size:calc(var(--s)*9px);color:var(--gold);letter-spacing:.2em}
#codebox p{margin:0;font-size:calc(var(--s)*5.2px);color:#d8cfe8;max-width:calc(var(--s)*250px);line-height:1.3}
#codebox .big{font-size:calc(var(--s)*17px);line-height:1.1;color:var(--hi);letter-spacing:.12em;-webkit-user-select:text;user-select:text;
  text-shadow:0 calc(var(--s)*1px) #7a3b12,calc(var(--s)*1px) calc(var(--s)*2px) #000}
#codebox .row{display:flex;gap:calc(var(--s)*2px)}
#codebox input{font:inherit;font-size:calc(var(--s)*8px);width:calc(var(--s)*74px);text-align:center;text-transform:uppercase;background:#150f26;
  color:var(--hi);border:calc(var(--s)*1px) solid var(--dim);padding:calc(var(--s)*2px);letter-spacing:.1em;outline:none;-webkit-user-select:text;user-select:text}
#codebox input:focus{border-color:var(--gold)}
#codebox button{font:inherit;font-size:calc(var(--s)*6px);color:var(--gold);background:#1b1330;border:calc(var(--s)*1px) solid var(--dim);
  padding:calc(var(--s)*2px) calc(var(--s)*5px);cursor:pointer}
#codebox button:hover{color:var(--hi);border-color:var(--gold)}
#codebox .small{font-size:calc(var(--s)*4.8px);color:#f0a090;min-height:1.3em}
</style>
</head>
<body>
<div id="wrap">
  <div id="top"><span>PAUL OF TARSUS &middot; <span id="chname">ESCAPE FROM DAMASCUS</span></span><span><button id="code" type="button">ENTER CODE</button><button id="mute" type="button">&#9835; SOUND ON</button></span></div>
  <div id="view">
    <canvas id="screen" width="640" height="288"></canvas>
    <div id="speech"></div>
    <div id="dim"></div>
    <div id="overlay"></div>
    <div id="codebox"></div>
  </div>
  <div id="status">&nbsp;</div>
  <div id="panel">
    <div id="verbs"></div>
    <div id="inv"></div>
    <div id="choices"></div>
  </div>
</div>
<script>
"use strict";
/* Paul of Tarsus: The Roman Road Runner. This file is the engine: layout, the paint toolkit, figures, the audio sequencer,
   verbs and inventory, safe-point codes and the level loader. Each chapter (its music, artwork, cast, rooms and dialog)
   is a separate file under levels/, loaded on demand. */
/* ============ CORE ============ */
const VW=320,VH=144;
const $=s=>document.querySelector(s);
const cv=$('#screen'),cx=cv.getContext('2d');
cx.imageSmoothingEnabled=false;
const G={ch:1,ship:null,room:null,verb:'walk',item:null,busy:true,flags:{},inv:[],cam:0,t:0,scene:null,
  hover:null,prays:0,hintAt:{},skip:null,started:0,dialog:false};
const VERBS=[['look','Look at'],['pickup','Pick up'],['use','Use'],['open','Open'],['talk','Talk to'],['give','Give']];
const VNAME={walk:'Walk to',look:'Look at',pickup:'Pick up',use:'Use',open:'Open',talk:'Talk to',give:'Give'};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  g.imageSmoothingEnabled=false;return[c,g]}
/* Rooms are painted at HR canvas pixels per room pixel, so the basic rectangle snaps to half a room pixel. */
const HR=2,hp=v=>Math.round(v*HR)/HR;
const R=(g,x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(hp(x),hp(y),hp(w),hp(h))};
/* layout scale */
function fit(){const top=10,st=13,pn=53,tot=144+top+st+pn;
  const d=window.devicePixelRatio||1,s=Math.min(innerWidth/320,innerHeight/tot),k=Math.floor(s*d)/d;
  document.documentElement.style.setProperty('--s',(k>=1?k:Math.max(.5,s)).toFixed(3))}
addEventListener('resize',fit);fit();
/* flags & inventory */
const F=G.flags;
const has=id=>G.inv.includes(id);
function addItem(id,quiet){if(!has(id)){G.inv.push(id);drawInv();if(!quiet)SFX.pick()}}
function delItem(id){const i=G.inv.indexOf(id);if(i>=0)G.inv.splice(i,1);if(G.item===id)G.item=null;drawInv()}
/* ============ AUDIO: Web Audio chiptune synth ============ */
const AU={ctx:null,muted:false,mood:'calm',step:0,next:0,score:null,amb:null};
function audioInit(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  const c=AU.ctx=new AC();
  AU.master=c.createGain();AU.master.gain.value=AU.muted?0:1;
  const comp=c.createDynamicsCompressor();AU.master.connect(comp);comp.connect(c.destination);
  AU.mus=c.createGain();AU.mus.gain.value=.55;AU.mus.connect(AU.master);
  AU.fx=c.createGain();AU.fx.gain.value=.7;AU.fx.connect(AU.master);
  AU.ambG=c.createGain();AU.ambG.gain.value=.5;AU.ambG.connect(AU.master);
  AU.reed=c.createBiquadFilter();AU.reed.type='lowpass';AU.reed.frequency.value=1900;AU.reed.Q.value=1.2;AU.reed.connect(AU.mus);
  const d=c.createDelay(1),fb=c.createGain(),lp=c.createBiquadFilter();
  d.delayTime.value=.34;fb.gain.value=.3;lp.type='lowpass';lp.frequency.value=1700;
  AU.send=c.createGain();AU.send.gain.value=.4;AU.send.connect(d);d.connect(lp);lp.connect(fb);fb.connect(d);lp.connect(AU.mus);
  const nb=c.createBuffer(1,c.sampleRate,c.sampleRate),ch=nb.getChannelData(0);
  for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;AU.nbuf=nb;
  AU.next=c.currentTime+.15;setInterval(sched,60);
}
const now=()=>AU.ctx?AU.ctx.currentTime:0;
const mtof=m=>440*Math.pow(2,(m-69)/12);
function tone(o){const c=AU.ctx;if(!c)return;const t=o.t||c.currentTime,osc=c.createOscillator(),g=c.createGain(),v=o.v||.2;
  osc.type=o.type||'triangle';osc.frequency.setValueAtTime(o.f,t);
  if(o.to)osc.frequency.exponentialRampToValueAtTime(o.to,t+o.d);
  if(o.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=5.2;lg.gain.value=o.vib;
    l.connect(lg);lg.connect(osc.frequency);l.start(t);l.stop(t+o.d+.1)}
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+(o.a||.006));
  if(o.sus){g.gain.setValueAtTime(v,t+o.d*.7);g.gain.linearRampToValueAtTime(.0001,t+o.d)}
  else g.gain.exponentialRampToValueAtTime(.0001,t+o.d);
  osc.connect(g);g.connect(o.dest||AU.fx);if(o.echo)g.connect(AU.send);
  osc.start(t);osc.stop(t+o.d+.05)}
function noise(o){const c=AU.ctx;if(!c)return;const t=o.t||c.currentTime,s=c.createBufferSource(),g=c.createGain(),fl=c.createBiquadFilter();
  s.buffer=AU.nbuf;s.loop=true;fl.type=o.type||'bandpass';fl.frequency.value=o.f||1000;fl.Q.value=o.q||1;
  g.gain.setValueAtTime(o.v||.2,t);g.gain.exponentialRampToValueAtTime(.0001,t+o.d);
  s.connect(fl);fl.connect(g);g.connect(o.dest||AU.fx);s.start(t,Math.random()*.5);s.stop(t+o.d+.05)}
/* --- music: every level brings its own score as plain data (see "music" in the level files) ---
   score = {dt: seconds per step, root: MIDI note of the tonic, scale: semitones of the mode, bars, tracks: [...]}
   A bar has 16 steps. A track plays only in the moods it lists (each room names its mood), and is one of:
     {drone:[semitones from the root], every: steps}            a held note, struck again every so often
     {drum:1, prog:'AB..', seq:{A:'d.t...t.'}}                  one character per step: see DRUMS
     {inst, prog:'AABA', seq:{A:[16 scale degrees, null = rest]}} a pattern per bar, chosen by prog
     {inst, from: bar, loop: bars, lines:[[[step,degree,length],..] per bar]}  a melody
   oct shifts a track by semitones, vol scales it, len sets note length in steps. */
const INST={
  oud(f,t,d,v){tone({f,t,d:.55,type:'triangle',v:v*.13,dest:AU.mus,echo:1});tone({f:f*2,t,d:.18,type:'square',v:v*.018,dest:AU.mus})},
  lyre(f,t,d,v){tone({f,t,d:.8,type:'triangle',v:v*.1,dest:AU.mus,echo:1});tone({f:f*2,t,d:.3,type:'sine',v:v*.045,dest:AU.mus});tone({f:f*3,t,d:.1,type:'sine',v:v*.02,dest:AU.mus})},
  harp(f,t,d,v){tone({f,t,d:.45,type:'sine',v:v*.11,dest:AU.mus,echo:1});tone({f:f*2,t,d:.14,type:'triangle',v:v*.04,dest:AU.mus})},
  ney(f,t,d,v){tone({f,t,d,type:'sine',v:v*.1,a:.05,sus:1,vib:4,dest:AU.mus,echo:1})},
  aulos(f,t,d,v){tone({f,t,d,type:'sawtooth',v:v*.05,a:.03,sus:1,vib:3,dest:AU.reed,echo:1});tone({f:f*1.003,t,d,type:'square',v:v*.012,a:.03,sus:1,dest:AU.reed})},
  bass(f,t,d,v){tone({f,t,d:Math.max(.3,d),type:'triangle',v:v*.17,dest:AU.mus});tone({f:f/2,t,d:Math.max(.3,d),type:'sine',v:v*.08,dest:AU.mus})},
  drone(f,t,d,v){tone({f,t,d,type:'triangle',v:v*.16,a:.6,sus:1,dest:AU.mus});tone({f:f*1.4983,t,d,type:'sine',v:v*.09,a:.9,sus:1,dest:AU.mus})}};
const DRUMS={
  d(t,v){tone({f:95,to:48,t,d:.22,type:'sine',v:v*.22,dest:AU.mus})},                    /* doum: the deep stroke of a frame drum */
  t(t,v){noise({t,d:.06,v:v*.07,f:2600,q:2,dest:AU.mus})},                               /* tek: the rim */
  k(t,v){noise({t,d:.03,v:v*.04,f:2600,q:2,dest:AU.mus})},                               /* ka: a lighter rim stroke */
  s(t,v){noise({t,d:.05,v:v*.035,f:6500,q:.8,type:'highpass',dest:AU.mus})},             /* shaker */
  c(t,v){noise({t,d:.09,v:v*.08,f:1500,q:1.4,dest:AU.mus});noise({t:t+.012,d:.07,v:v*.05,f:1700,q:1.4,dest:AU.mus})},   /* hand clap */
  b(t,v){tone({f:2637,t,d:.6,type:'sine',v:v*.03,dest:AU.mus,echo:1});tone({f:3520,t,d:.3,type:'sine',v:v*.012,dest:AU.mus})}};   /* finger cymbal */
function playStep(st,t){const sc=AU.score;if(!sc)return;const bar=st>>4,s=st&15,m=AU.mood,L=sc.scale.length,
  deg=(n,oct)=>mtof(sc.root+12*Math.floor(n/L)+sc.scale[((n%L)+L)%L]+(oct||0));
  for(const tr of sc.tracks){if(tr.moods&&!tr.moods.includes(m))continue;const v=tr.vol==null?1:tr.vol,pr=tr.prog||'A';
    if(tr.drone){const ev=tr.every||32;if(st%ev===0)for(const n of tr.drone)INST.drone(mtof(sc.root+n),t,ev*sc.dt+.4,v)}
    else if(tr.drum){const ch=tr.seq[pr[bar%pr.length]][s];if(ch&&DRUMS[ch])DRUMS[ch](t,v)}
    else if(tr.seq){const n=tr.seq[pr[bar%pr.length]][s];if(n!=null)INST[tr.inst](deg(n,tr.oct),t,(tr.len||3)*sc.dt,v)}
    else if(tr.lines){let i=bar-(tr.from||0);if(i<0)continue;if(tr.loop)i%=tr.loop;for(const[n0,dg,len]of tr.lines[i]||[])if(n0===s)INST[tr.inst](deg(dg,tr.oct),t,len*sc.dt*.95,v)}}}
function setScore(sc){if(AU.score!==sc){AU.score=sc;AU.step=0}}
function sched(){const c=AU.ctx;if(!c||c.state!=='running')return;const sc=AU.score;
  if(AU.next<c.currentTime-.5)AU.next=c.currentTime+.05;
  while(sc&&AU.next<c.currentTime+.25){playStep(AU.step,AU.next);AU.next+=sc.dt;AU.step=(AU.step+1)%((sc.bars||16)*16)}
  ambience(c.currentTime)}
/* --- ambience: each room names the sounds around it and how loud they are, e.g. amb:{crickets:.6,wind:.3}.
   Beds are filtered noise that runs all the time; calls are short sounds scattered at random intervals. --- */
const BEDS={wind:{type:'lowpass',f:420,q:.6,lfo:.13,depth:.5,v:.5},waves:{type:'lowpass',f:760,q:.5,lfo:.1,depth:.8,v:.55},fountain:{type:'highpass',f:2200,q:.7,lfo:2.1,depth:.12,v:.16},
  crowd:{type:'bandpass',f:520,q:.7,lfo:.37,depth:.45,v:.3},leaves:{type:'bandpass',f:3400,q:.6,lfo:.21,depth:.7,v:.14}};
const CALLS={
  crickets:[.28,.65,(t,d)=>{const f=4200+Math.random()*500;for(let i=0;i<3+(Math.random()*2|0);i++)tone({f,t:t+i*.045,d:.03,type:'sine',v:.06,dest:d})}],
  fire:[.05,.35,(t,d)=>noise({t,d:.02+Math.random()*.04,v:.05+Math.random()*.12,f:1500+Math.random()*2500,q:.8,type:'highpass',dest:d})],
  birds:[.7,3.8,(t,d)=>{const n=1+(Math.random()*3|0),f=2400+Math.random()*1400;for(let i=0;i<n;i++)tone({f:f*(1+i*.08),to:f*(1.25+Math.random()*.3),t:t+i*.11,d:.07,type:'sine',v:.075,dest:d})}],
  gulls:[3.5,9,(t,d)=>{const n=2+(Math.random()*3|0);for(let i=0;i<n;i++)tone({f:1500-i*60,to:880,t:t+i*.34,d:.26,type:'triangle',v:.08,vib:30,dest:d})}],
  owl:[7,15,(t,d)=>{tone({f:392,t,d:.28,type:'sine',v:.09,a:.05,sus:1,dest:d});tone({f:370,t:t+.42,d:.5,type:'sine',v:.09,a:.05,sus:1,dest:d})}],
  creak:[4,10,(t,d)=>{tone({f:120,to:150,t,d:.4,type:'sawtooth',v:.03,dest:d});tone({f:150,to:118,t:t+.4,d:.45,type:'sawtooth',v:.025,dest:d})}],
  hooves:[5,12,(t,d)=>{for(let i=0;i<4;i++)noise({t:t+i*.16+(i%2)*.05,d:.04,v:.09,f:900,q:2,dest:d})}],

function skin(){const[c,g]=mk(256,64);for(let j=0;j<4;j++){R(g,0,j*16,256,16,tint('#3a2616',(j%2)*-.12-.05));R(g,0,j*16,256,1,'#0e0806');R(g,0,j*16+1,256,1,'#5a3e24')}
  tex(g,'wood',.7,0,0,256,64,'overlay',1);tex(g,'mott',.35,0,0,256,64,'overlay',1);for(let i=0;i<5;i++)R(g,20+i*53,(i%4)*16+3,1,11,'rgba(0,0,0,.35)');
  document.documentElement.style.setProperty('--wood',`url(${c.toDataURL()})`)}
function drawInv(){const el=$('#inv');el.innerHTML='';for(let i=0;i<10;i++){const s=document.createElement('div');s.className='slot';const id=G.inv[i];
  if(id){const src=iconArt(ITEMS[id].icon||id),[c,g]=mk(48,48);g.drawImage(src,0,0);s.appendChild(c);if(G.item===id)s.classList.add('sel');
    s.onmouseenter=()=>{G.hover={item:id};status()};s.onmouseleave=()=>{G.hover=null;status()};s.onclick=()=>clickItem(id)}
  el.appendChild(s)}}
function status(){const el=$('#status');if(G.busy){el.textContent=' ';return}
  let s=VNAME[G.verb];const h=G.hover,hn=h?(h.item?ITEMS[h.item].name:h.name):'';
  if(G.item){s+=' '+ITEMS[G.item].name+(G.verb==='give'?' to':' with');if(hn&&!(h&&h.item===G.item))s+=' '+hn}else if(hn)s+=' '+hn;
  el.textContent=s}
const DEF={look:h=>'Nothing more to see there.',pickup:h=>h.actor?'That would hardly be loving.':'I have no need of that.',
  use:h=>h.actor?'People are not tools.':'I see no use in that right now.',open:h=>'That does not open.',
  talk:h=>'I would get no answer.',give:h=>'First I should choose something to give.'};
const NOPE=['That will not work.','Those do not go together.','No. I should think it through calmly.'];
function clickItem(id){if(G.busy)return;audioInit();const it=ITEMS[id],a=G.item;
  if(a&&a!==id)return cut(()=>combine(a,id));
  if(G.verb==='use'||G.verb==='give'){G.item=a===id?null:id;SFX.click();drawInv();status();return}
  if(G.verb==='open'&&it.open)return cut(it.open);
  if(G.verb==='walk'||G.verb==='look')return cut(()=>say(P,it.look));
  cut(()=>say(P,G.verb==='pickup'?'I am already carrying it.':G.verb==='open'?'That does not open.':'It is only '+it.name+'.'))}
function hsAt(x,y){for(const a of Object.values(ACT))if(a!==P&&a.room===G.room&&a.hs&&Math.abs(x-a.x)<=10&&y>=a.y-49&&y<=a.y+1)return a.hs;
  const hs=ROOMS[G.room].hs;for(let i=hs.length-1;i>=0;i--){const h=hs[i];if((!h.vis||h.vis())&&x>=h.x&&x<h.x+h.w&&y>=h.y&&y<h.y+h.h)return h}return null}
async function act(v,h,item){
  const run=async x=>{if(typeof x==='function')return x(h);for(const s of[].concat(x))await say(P,s)};
  if(v==='exit')return h.exit();
  if(item){const fn=v==='give'?h.give:h.useWith;if(fn&&await fn(item)!==false)return;
    SFX.nope();return say(P,v==='give'?(h.actor?'I do not think that is needed.':'I cannot give anything to that.'):pick(NOPE))}
  if((v==='use'||v==='open')&&h[v]==null&&h.exit)return h.exit();
  if(h[v]!=null)return run(h[v]);
  return say(P,DEF[v](h))}
async function clickView(x,y){
  if(G.skip){if(performance.now()-G.lineT>230)G.skip();return}
  if(G.busy||G.scene||!G.room)return;audioInit();
  const h=hsAt(x,y),item=G.item;let v=G.verb;
  if(!h){if(v!=='walk'||item){G.verb='walk';G.item=null;syncVerbs();drawInv();status()}walk(P,x,y);return}
  if(v==='walk')v=h.exit?'exit':h.actor?'talk':'look';
  const A=h.actor,tx=A?A.x+(P.x<A.x?-22:22):(h.wx!=null?h.wx:h.x+h.w/2),ty=A?A.y+1:(h.wy!=null?h.wy:118);

const vp=$('#view');
function evPos(e){const r=vp.getBoundingClientRect();return[(e.clientX-r.left)/r.width*VW+G.cam,(e.clientY-r.top)/r.height*VH]}
vp.addEventListener('mousemove',e=>{if(G.busy||G.scene||!G.room)return;const[x,y]=evPos(e);const h=hsAt(x,y);if(h!==G.hover){G.hover=h;status()}});
vp.addEventListener('mouseleave',()=>{G.hover=null;status()});
vp.addEventListener('click',e=>{const[x,y]=evPos(e);clickView(x,y)});
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;const k=e.key.toLowerCase();
  if(k===' '||k==='escape'||k==='.'){if(G.skip){e.preventDefault();G.skip()}}
  else if(k==='m')$('#mute').click();else if(k==='p')pray();
  else if(k>='1'&&k<='6'){const b=document.querySelectorAll('#verbs button')[+k-1];if(b)b.click()}});
/* --- main loop --- */
let lastT=0,stepT=0;
function update(ts){const dt=Math.min(.05,(ts-lastT)/1000);lastT=ts;
  for(const a of Object.values(ACT)){const w=a.walk;if(!w){a.fr=0;continue}
    const dx=w.x-a.x,dy=w.y-a.y,d=Math.hypot(dx,dy*2),sp=(a.speed||G.speedAll||88)*dt;
    if(d<=sp){a.x=w.x;a.y=w.y;a.walk=null;a.fr=0;w.res(true)}
    else{a.x+=dx/d*sp;a.y+=dy/d*sp;a.fr=Math.floor(ts/120)%4;if(a.room===G.room&&ts-stepT>250){stepT=ts;SFX.step()}}}
  if(G.room&&!G.scene){const t=clamp(P.x-160,0,ART[G.room].w-320);G.cam+=(t-G.cam)*Math.min(1,dt*5);if(Math.abs(t-G.cam)<.5)G.cam=t}}
/* --- figures: each pose is drawn once into a cached sprite (dark contour, dither), then lit by the room and laid on the scene --- */
const[SA,sa]=mk(FIG.W,FIG.H),[SB,sb]=mk(FIG.W,FIG.H),SPR=new Map();
function sprite(key,fn){let c=SPR.get(key);if(c)return c;if(SPR.size>500)SPR.clear();

  sb.setTransform(1,0,0,1,0,0);sb.globalCompositeOperation='copy';sb.drawImage(SA,0,0);sb.globalCompositeOperation='source-in';sb.fillStyle='#1c1218';sb.fillRect(0,0,FIG.W,FIG.H);
  const[o,og]=mk(FIG.W,FIG.H);for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]])og.drawImage(SB,dx,dy);og.drawImage(SA,0,0);finish(o,og,12);SPR.set(key,o);return o}
/* The light a room throws on a figure standing at x,y: an ambient color plus any lamps within reach. null means plain daylight. */
function lightAt(id,x,y){let L=id&&ART[id].light;if(typeof L==='function')L=L();if(!L)return null;let[r,g,b]=hex(L.amb||'#ffffff');
  for(const[lx,ly,lr,c]of L.lamps||[]){const d=Math.hypot(x-lx,(y-22-ly)*1.5)/lr;if(d<1){const k=(1-d)*(1-d),q=hex(c);r+=q[0]*k;g+=q[1]*k;b+=q[2]*k}}
  for(const[x0,x1,c]of L.shade||[]){const k=clamp(Math.min(x-x0,x1-x)/8,0,1);if(k>0){const q=hex(c);r*=1-k+k*q[0]/255;g*=1-k+k*q[1]/255;b*=1-k+k*q[2]/255}}
  return r>=254&&g>=254&&b>=254?null:toHex(r,g,b)}
/* figure: place a sprite with its feet at x,y. lit: the light on it; key: names the pose for the cache; sw: shadow half-width (0 for none). */
function figure(g,x,y,lit,key,fn,sw){x=hp(x);y=hp(y);if(sw!==0){oval(g,x,y-.4,sw||8.5,2,'rgba(0,0,0,.2)');oval(g,x,y-.4,(sw||8.5)*.68,1.3,'rgba(0,0,0,.24)')}
  const c=sprite(key,fn),W=FIG.W/HR,Hh=FIG.H/HR,dx=x-FIG.OX/HR,dy=y-FIG.OY/HR;if(!lit){g.drawImage(c,dx,dy,W,Hh);return}
  sb.globalCompositeOperation='copy';sb.drawImage(c,0,0);sb.globalCompositeOperation='multiply';sb.fillStyle=lit;sb.fillRect(0,0,FIG.W,FIG.H);
  sb.globalCompositeOperation='destination-in';sb.drawImage(c,0,0);g.drawImage(SB,dx,dy,W,Hh)}
const blinks=(o,ts)=>((ts+o.ph)%4300)<140;
/* man: a person by look id, for scenes that pose figures themselves (the ship, the road). */
function man(g,x,y,id,dir,fr,lit,ges,sw){const o=LOOK[id];figure(g,x,y,lit,id+dir+fr+(ges?'g':''),s=>person(s,0,0,o,dir,fr,0,0,ges,0),sw)}
const beast=(g,x,y,dir,fr,load,lit)=>figure(g,x,y,lit,'donkey'+dir+fr+load,s=>donkey(s,0,0,dir,fr,load),15);
function drawActor(g,o,ts,id){const talk=o.talk&&Math.floor(ts/130)%2?1:0,ges=o.talk&&Math.floor(ts/560)%3===1?1:0,bl=o.bow||blinks(o.look,ts)?1:0,bow=o.bow?1:0;
  figure(g,o.x,o.y,lightAt(id,o.x,o.y),o.id+o.dir+o.fr+talk+bow+ges+bl,s=>person(s,0,0,o.look,o.dir,o.fr,talk,bow,ges,bl))}
function render(ts){G.t=ts;update(ts);cx.setTransform(HR,0,0,HR,0,0);cx.imageSmoothingEnabled=false;cx.fillStyle='#000';cx.fillRect(0,0,VW,VH);

  else if(G.room){const id=G.room,a=ART[id],cam=hp(G.cam),f=fg(id);backdrop(cx,id,cam);cx.save();cx.translate(-cam,0);a.draw(cx,ts);
    Object.values(ACT).filter(o=>o.room===id).sort((p,q)=>p.y-q.y).forEach(o=>drawActor(cx,o,ts,id));

    cx.save();cx.translate(-cam,0);a.front(cx,ts);cx.restore()}
  posSpeech();requestAnimationFrame(render)}
/* ============ GAME: items, combinations, prayer hints ============ */
Object.assign(ITEMS,{
  awl:{name:'awl',look:'A stout awl for piercing goat-hair cloth and leather. It has stitched more tents than I can count.'},
  thread:{name:'waxed thread',look:'Strong linen thread, waxed against the weather.'},
  knife:{name:"tentmaker's knife",look:'A half-moon blade for cutting cloth and leather. A tool for making, not for harming.'}});
const COMBO={'awl+thread':()=>say(P,'Threaded and ready. Now, what needs stitching?')};
async function combine(a,b){const c=COMBO[[a,b].sort().join('+')];if(c)return c();SFX.nope();return say(P,pick(NOPE))}
/* --- "Pray to Jehovah": a pause for calm, then a context-sensitive thought. Never changes the game state. --- */
const PRAYERS=['Paul bows his head and quietly asks Jehovah for wisdom and a calm heart.',
  'Paul pauses, and in prayer throws his anxiety on Jehovah.','In the stillness, Paul asks Jehovah to help him think clearly.'];
function hint(){return CHAP[G.ch].hint()}
function pray(){if(G.busy||G.scene||!G.room)return;audioInit();
  cut(async()=>{G.prays++;const d=$('#dim'),m=AU.mus,ab=AU.ambG;d.style.opacity=.55;P.bow=true;SFX.pray();
    if(m){m.gain.setTargetAtTime(.12,now(),.3);ab.gain.setTargetAtTime(.15,now(),.3)}
    await wait(900);
    await say(null,G.prays===1?PRAYERS[0]+' (James 1:5)':pick(PRAYERS),{dur:4200,color:'#cfe2ff'});
    await wait(500);P.bow=false;d.style.opacity=0;if(m){m.gain.setTargetAtTime(.55,now(),.8);ab.gain.setTargetAtTime(.5,now(),.8)}
    await wait(600);
    const[k,ls]=hint(),n=G.hintAt[k]=(G.hintAt[k]||0)+1;
    await say(P,ls[Math.min(n,ls.length)-1],{thought:1,color:'#cfe2ff'})})}
/* ============ SHARED SCRIPT HELPERS ============ */
const take=(flag,item,line)=>async()=>{F[flag]=1;addItem(item);await say(P,line)};
const TH={thought:1,color:'#cfe2ff'};
async function quiz(who,q,opts){await say(who,q);let av=opts.slice();
  for(;;){const o=av[await choose(av.map(o=>o.q))];for(const l of o.p||[o.q])await say(P,l);for(const l of o.r)await say(who,l);
    if(o.ok)return;av=av.filter(x=>x!==o);await say(who,q)}}
/* ============ SCENES: title, intro, finale, chapter complete ============ */
const ov=$('#overlay');
function tween(ms,fn){return new Promise(res=>{const t0=performance.now();(function f(){const k=Math.min(1,(performance.now()-t0)/ms);fn(k);k<1?requestAnimationFrame(f):res()})()})}
/* ============ LEVELS: each chapter is a separate file under levels/, loaded on demand ============ */
/* The manifest holds only what is needed before a level is loaded: its name, its file, and the salt that validates its codes. */
const CHAP={
  1:{name:'ESCAPE FROM DAMASCUS',label:'Chapter One &middot; Escape from Damascus',salt:0x5A17,src:'levels/chapter1.js'},
  2:{name:'A FRIEND IN JERUSALEM',label:'Chapter Two &middot; A Friend in Jerusalem',salt:0x2B6D,src:'levels/chapter2.js'},
  3:{name:'CALLED TO ANTIOCH',label:'Chapter Three &middot; Called to Antioch',salt:0x3C91,src:'levels/chapter3.js'}};
const TITLE={level:1,scene:'wall',mood:'calm',amb:{crickets:.5,wind:.35,owl:.4}};
/* A level file calls LEVEL(n, init). init() registers its art, cast, items and rooms, and returns the chapter definition. */
function LEVEL(n,init){Object.assign(CHAP[n],init(),{ready:1})}
function loadLevel(n){const c=CHAP[n];if(c.ready)return Promise.resolve();
  return c.loading||(c.loading=new Promise((res,rej)=>{const el=document.createElement('script');el.src=c.src;
    el.onload=()=>c.ready?res():rej(new Error(c.src+' did not register a level'));
    el.onerror=()=>{c.loading=null;el.remove();rej(new Error('Could not load '+c.src))};document.head.appendChild(el)}))}
function loadFail(e){console.error(e);ov.className='on end';ov.onclick=()=>location.reload();
  ov.innerHTML='<h2>LEVEL NOT FOUND</h2><p>'+e.message+'</p><p class="small">The chapter files live in the levels folder next to index.html.</p><p class="go">Click to reload</p>'}
async function startChapter(n){ov.onclick=null;try{await loadLevel(n)}catch(e){return loadFail(e)}return CHAP[n].start()}
async function title(){lock(true);try{await loadLevel(TITLE.level)}catch(e){return loadFail(e)}
  setChapter(TITLE.level);G.scene=CHAP[TITLE.level].scenes[TITLE.scene];G.end={};AU.mood=TITLE.mood;AU.amb=TITLE.amb;
  ov.className='on';ov.innerHTML='<h1>PAUL OF TARSUS</h1><h2>THE ROMAN ROAD RUNNER</h2>'+
    '<p class="small">A point-and-click adventure based on the book of Acts</p>'+
    Object.keys(CHAP).map((n,i)=>`<p class="${i?'pick':'go'}" data-ch="${n}">&#9656; ${CHAP[n].label}</p>`).join('')+
    '<p class="small">Click a chapter to begin. Returning? Use ENTER CODE, top right.</p>';
  ov.onclick=e=>{const c=e.target.dataset&&e.target.dataset.ch;startChapter(+c||1)};codeBtn();G.ready=1}
/* ============ SAFE-POINT CODES: chapter and game state packed into letters and numbers ============ */
const A32='0123456789ABCDEFGHJKMNPQRSTVWXYZ',cb=$('#codebox');
const chk=(b,s)=>{let h=Math.imul(b^s,0x9E3779B1)>>>0;h^=h>>>13;return h>>>4&511};
const msk=c=>Math.imul(c+1,0x2545F)&0x1FFFFF;
function stateBits(){const c=CHAP[G.ch];let b=0;c.flags.forEach((k,i)=>{if(F[k])b|=1<<i});return b|Math.max(0,c.rooms.indexOf(G.room))<<19}
function codeOf(ch,b){const c=chk(b,CHAP[ch].salt),v=(b^msk(c))*512+c;let s='';
  for(let i=5;i>=0;i--)s+=A32[Math.floor(v/Math.pow(32,i))%32];return(ch>1?ch+'-':'')+s.slice(0,3)+'-'+s.slice(3)}
const makeCode=()=>codeOf(G.ch,stateBits());
function decode(t){t=(t||'').toUpperCase().replace(/O/g,'0').replace(/[IL]/g,'1').replace(/U/g,'V').replace(/[^0-9A-Z]/g,'');

  if(t.length!==6)return null;let v=0;for(const x of t){const i=A32.indexOf(x);if(i<0)return null;v=v*32+i}

function setChapter(ch){G.ch=ch;for(const k in F)delete F[k];
  Object.values(ACT).forEach(a=>{if(a!==P)a.room=null;a.bow=a.talk=false;a.walk=null});
  $('#chname').textContent=CHAP[ch].name;G.ship=null;setScore(CHAP[ch].music);CHAP[ch].setup()}
function applyState(s){setChapter(s.ch);const c=CHAP[s.ch],room=c.rooms[s.b>>19&3];c.flags.forEach((k,i)=>{if(s.b>>i&1)F[k]=1});
  if(c.place)c.place(room);G.inv=c.inv(room);
  ov.className='';ov.onclick=null;G.scene=null;G.end={};G.item=null;G.verb='walk';G.hover=null;$('#dim').style.opacity=0;
  enterRoom(room,...c.ent[room]);if(!G.started)G.started=performance.now();
  G.busy=false;lock(false);syncVerbs();drawInv();status();codeBtn()}
function codeBtn(){$('#code').textContent=G.room&&!G.scene?'CODE '+makeCode():'ENTER CODE'}
function closeCode(){cb.classList.remove('on');G.busy=cb.was;if(!G.busy)lock(false);status()}
async function tryCode(){const b=decode($('#codein').value);
  if(b==null){SFX.nope();$('#codemsg').textContent='That code is not valid. Please check each letter and number.';return}
  try{await loadLevel(b.ch)}catch(e){SFX.nope();$('#codemsg').textContent=e.message;return}
  cb.classList.remove('on');SFX.good();applyState(b)}
function openCode(){audioInit();if(cb.classList.contains('on'))return closeCode();
  const can=G.room&&!G.scene&&!G.busy;if(!can&&!ov.classList.contains('on')){SFX.nope();return}
  SFX.click();cb.was=G.busy;G.busy=true;lock(true);status();
  cb.innerHTML=(can?'<h2>SAFE POINT</h2><p>Your code for this exact point in the story:</p><div class="big">'+makeCode()+
      '</div><p>Write it down. Enter it here, or from the title screen, to return to this point.</p>'
      :'<h2>ENTER CODE</h2><p>Type a code from an earlier game to continue from that point.</p>')+
    '<div class="row"><input id="codein" maxlength="9" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXX-XXX">'+
    '<button id="codego" type="button">GO</button></div><p id="codemsg" class="small">&nbsp;</p>'+
    '<button id="codex" type="button">'+(can?'Back to the game':'Back')+'</button>';
  cb.classList.add('on');$('#codego').onclick=tryCode;$('#codex').onclick=closeCode;
  $('#codein').onkeydown=e=>{if(e.key==='Enter')tryCode();else if(e.key==='Escape')closeCode()};if(!can)$('#codein').focus()}
$('#code').onclick=e=>{e.stopPropagation();openCode()};cb.onclick=e=>e.stopPropagation();
skin();buildVerbs();requestAnimationFrame(render);title();
</script>
