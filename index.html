<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paul of Tarsus: The Roman Road Runner</title>
<style>
:root{--s:3;--gold:#d9a441;--hi:#fff3b8;--dim:#7a5a22;--ink:#0b0812;--pray:#9cc4f0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#ddd;overflow:hidden;
  font-family:"Lucida Console",Monaco,"Courier New",monospace;font-weight:bold;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center}
#wrap{width:calc(var(--s)*320px);background:var(--ink)}
#top{display:flex;justify-content:space-between;align-items:center;height:calc(var(--s)*10px);
  padding:0 calc(var(--s)*3px);font-size:calc(var(--s)*5px);color:var(--dim);letter-spacing:.08em}
#top button{font:inherit;color:var(--gold);background:none;border:1px solid var(--dim);
  padding:0 calc(var(--s)*3px);height:calc(var(--s)*8px);cursor:pointer}
#top button:hover{color:var(--hi);border-color:var(--gold)}
#view{position:relative;width:calc(var(--s)*320px);height:calc(var(--s)*144px);overflow:hidden;cursor:crosshair}
#screen{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#speech{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:3}
.line{position:absolute;transform:translateX(-50%);text-align:center;width:max-content;
  max-width:calc(var(--s)*200px);font-size:calc(var(--s)*6.2px);line-height:1.25;
  text-shadow:calc(var(--s)*1px) 0 #000,calc(var(--s)*-1px) 0 #000,0 calc(var(--s)*1px) #000,0 calc(var(--s)*-1px) #000,
   calc(var(--s)*1px) calc(var(--s)*1px) #000,calc(var(--s)*-1px) calc(var(--s)*1px) #000,calc(var(--s)*1px) calc(var(--s)*-1px) #000,calc(var(--s)*-1px) calc(var(--s)*-1px) #000}
#dim{position:absolute;z-index:2;inset:0;background:#05030c;opacity:0;pointer-events:none;transition:opacity .9s}
#overlay{position:absolute;z-index:4;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:calc(var(--s)*8px);cursor:pointer}
#overlay.on{display:flex}
#overlay h1{margin:0;font-size:calc(var(--s)*17px);line-height:1;color:var(--gold);letter-spacing:.04em;
  text-shadow:0 calc(var(--s)*1px) #7a3b12,0 calc(var(--s)*2px) #3a1608,calc(var(--s)*2px) calc(var(--s)*3px) #000}
#overlay h2{margin:calc(var(--s)*3px) 0;font-size:calc(var(--s)*8px);color:#f0e2c0;letter-spacing:.2em;
  text-shadow:calc(var(--s)*1px) calc(var(--s)*1px) #000}
#overlay p{margin:calc(var(--s)*2px) 0;font-size:calc(var(--s)*5.4px);line-height:1.35;color:#d8cfe8;
  max-width:calc(var(--s)*270px);text-shadow:calc(var(--s)*1px) calc(var(--s)*1px) #000}
#overlay .small{font-size:calc(var(--s)*4.4px);color:#a99cc0}
#overlay .go{color:var(--hi);animation:bl 1.1s steps(2) infinite}
#overlay .go,#overlay .pick{font-size:calc(var(--s)*6.2px);margin:calc(var(--s)*2.5px) 0}
#overlay .pick{color:var(--gold)}
#overlay .pick:hover{color:#fff}
#overlay.end{background:rgba(6,4,14,.82)}
@keyframes bl{50%{opacity:.25}}
#status{height:calc(var(--s)*11px);line-height:calc(var(--s)*11px);text-align:center;
  font-size:calc(var(--s)*6.2px);color:var(--hi);background:#140e22;white-space:nowrap;overflow:hidden;
  border-top:calc(var(--s)*1px) solid #2a1d44;border-bottom:calc(var(--s)*1px) solid #2a1d44}
#panel{display:flex;height:calc(var(--s)*46px);padding:calc(var(--s)*2px);gap:calc(var(--s)*3px);position:relative}
#verbs{width:46%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:calc(var(--s)*1px)}
#verbs button,#choices button{font:inherit;font-size:calc(var(--s)*6.2px);color:var(--gold);background:#1b1330;
  border:0;cursor:pointer;padding:0;text-align:center}
#verbs button:hover{color:var(--hi);background:#2a1d49}
#verbs button.sel{color:#fff;background:#4a2f1a}
#verbs #pray{grid-column:1/4;color:var(--pray);background:#12203a;letter-spacing:.06em}
#verbs #pray:hover{color:#fff;background:#1c3358}
#inv{flex:1;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);gap:calc(var(--s)*1px)}
#inv .slot{background:#150f26;display:flex;align-items:center;justify-content:center;cursor:pointer;outline:0 solid var(--gold)}
#inv .slot:hover{background:#2a1d49}
#inv .slot.sel{outline-width:calc(var(--s)*1px);outline-offset:calc(var(--s)*-1px);background:#3a2714}
#inv canvas{height:calc(var(--s)*20px);width:calc(var(--s)*20px);image-rendering:pixelated;image-rendering:crisp-edges;pointer-events:none}
#choices{position:absolute;inset:calc(var(--s)*2px);display:none;flex-direction:column;gap:calc(var(--s)*1px);
  background:var(--ink);overflow:auto}
#choices.on{display:flex}
#choices button{text-align:left;padding:0 calc(var(--s)*4px);flex:0 0 calc(var(--s)*7.6px);line-height:calc(var(--s)*7.6px);font-size:calc(var(--s)*5.4px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#choices button:hover{color:var(--hi);background:#2a1d49}
#panel.locked #verbs,#panel.locked #inv{opacity:.35;pointer-events:none}
#top button{margin-left:calc(var(--s)*2px)}
#codebox{position:absolute;z-index:5;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--s)*3px);
  background:rgba(6,4,14,.92);text-align:center;cursor:default;padding:calc(var(--s)*8px)}
#codebox.on{display:flex}
#codebox h2{margin:0;font-size:calc(var(--s)*9px);color:var(--gold);letter-spacing:.2em}
#codebox p{margin:0;font-size:calc(var(--s)*5.2px);color:#d8cfe8;max-width:calc(var(--s)*250px);line-height:1.3}
#codebox .big{font-size:calc(var(--s)*17px);line-height:1.1;color:var(--hi);letter-spacing:.12em;-webkit-user-select:text;user-select:text;
  text-shadow:0 calc(var(--s)*1px) #7a3b12,calc(var(--s)*1px) calc(var(--s)*2px) #000}
#codebox .row{display:flex;gap:calc(var(--s)*2px)}
#codebox input{font:inherit;font-size:calc(var(--s)*8px);width:calc(var(--s)*74px);text-align:center;text-transform:uppercase;background:#150f26;
  color:var(--hi);border:calc(var(--s)*1px) solid var(--dim);padding:calc(var(--s)*2px);letter-spacing:.1em;outline:none;-webkit-user-select:text;user-select:text}
#codebox input:focus{border-color:var(--gold)}
#codebox button{font:inherit;font-size:calc(var(--s)*6px);color:var(--gold);background:#1b1330;border:calc(var(--s)*1px) solid var(--dim);
  padding:calc(var(--s)*2px) calc(var(--s)*5px);cursor:pointer}
#codebox button:hover{color:var(--hi);border-color:var(--gold)}
#codebox .small{font-size:calc(var(--s)*4.8px);color:#f0a090;min-height:1.3em}
</style>
</head>
<body>
<div id="wrap">
  <div id="top"><span>PAUL OF TARSUS &middot; <span id="chname">ESCAPE FROM DAMASCUS</span></span><span><button id="code" type="button">ENTER CODE</button><button id="mute" type="button">&#9835; SOUND ON</button></span></div>
  <div id="view">
    <canvas id="screen" width="640" height="288"></canvas>
    <div id="speech"></div>
    <div id="dim"></div>
    <div id="overlay"></div>
    <div id="codebox"></div>
  </div>
  <div id="status">&nbsp;</div>
  <div id="panel">
    <div id="verbs"></div>
    <div id="inv"></div>
    <div id="choices"></div>
  </div>
</div>
<script>
"use strict";
/* ============ CORE ============ */
const VW=320,VH=144;
const $=s=>document.querySelector(s);
const cv=$('#screen'),cx=cv.getContext('2d');
cx.imageSmoothingEnabled=false;
const G={ch:1,ship:null,room:null,verb:'walk',item:null,busy:true,flags:{},inv:[],cam:0,t:0,scene:null,
  hover:null,prays:0,hintAt:{},skip:null,started:0,dialog:false};
const VERBS=[['look','Look at'],['pickup','Pick up'],['use','Use'],['open','Open'],['talk','Talk to'],['give','Give']];
const VNAME={walk:'Walk to',look:'Look at',pickup:'Pick up',use:'Use',open:'Open',talk:'Talk to',give:'Give'};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  g.imageSmoothingEnabled=false;return[c,g]}
/* pixel helpers */
const R=(g,x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))};
function bands(g,x,y,w,h,cols){const n=cols.length,bh=h/n;for(let i=0;i<n;i++)R(g,x,y+Math.floor(i*bh),w,Math.ceil(bh)+1,cols[i])}
function speck(g,x,y,w,h,c,n,r){g.fillStyle=c;for(let i=0;i<n;i++)g.fillRect(x+Math.floor(r()*w),y+Math.floor(r()*h),1,1)}
function dith(g,x,y,w,h,c,step){g.fillStyle=c;for(let j=0;j<h;j++)for(let i=(j%2)*(step>>1);i<w;i+=step)g.fillRect(x+i,y+j,1,1)}
function bricks(g,x,y,w,h,bw,bh,base,alt,mortar,r){R(g,x,y,w,h,mortar);
  for(let j=0,row=0;j<h;j+=bh,row++){const off=row%2?-(bw>>1):0;
    for(let i=off;i<w;i+=bw){const x0=Math.max(0,i),x1=Math.min(w,i+bw-1),hh=Math.min(bh-1,h-j);
      if(x1>x0)R(g,x+x0,y+j,x1-x0,hh,r()<.3?alt:base)}}}
function planks(g,x,y,w,h,pw,c1,c2,line){for(let i=0;i<w;i+=pw){R(g,x+i,y,Math.min(pw,w-i),h,(i/pw)%2?c1:c2);R(g,x+i,y,1,h,line)}}
function ell(g,x,y,rx,ry,c){g.fillStyle=c;for(let j=-ry;j<=ry;j++){const hw=Math.round(rx*Math.sqrt(1-(j*j)/(ry*ry||1)));
  g.fillRect(Math.round(x-hw),Math.round(y+j),hw*2+1,1)}}
function glow(g,x,y,r,rgb,a){const o=g.globalCompositeOperation;g.globalCompositeOperation='lighter';
  for(let i=4;i>=1;i--){ell(g,x,y,Math.round(r*i/4),Math.round(r*i/4*.8),`rgba(${rgb},${a})`)}
  g.globalCompositeOperation=o}
function line(g,x0,y0,x1,y1,c){g.fillStyle=c;x0|=0;y0|=0;x1|=0;y1|=0;const dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;
  let e=dx-dy;for(;;){g.fillRect(x0,y0,1,1);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>-dy){e-=dy;x0+=sx}if(e2<dx){e+=dx;y0+=sy}}}
function starfield(g,w,h,n,r){for(let i=0;i<n;i++){const b=r();R(g,Math.floor(r()*w),Math.floor(r()*h),1,1,b>.85?'#fff':b>.5?'#b9b6e6':'#6c6aa8')}}
/* layout scale */
function fit(){const top=10,st=13,pn=50,tot=144+top+st+pn;
  const s=Math.max(1,Math.min(innerWidth/320,innerHeight/tot));
  document.documentElement.style.setProperty('--s',(s>=2?Math.floor(s*2)/2:s).toFixed(2))}
addEventListener('resize',fit);fit();
/* flags & inventory */
const F=G.flags;
const has=id=>G.inv.includes(id);
function addItem(id,quiet){if(!has(id)){G.inv.push(id);drawInv();if(!quiet)SFX.pick()}}
function delItem(id){const i=G.inv.indexOf(id);if(i>=0)G.inv.splice(i,1);if(G.item===id)G.item=null;drawInv()}
/* ============ AUDIO: Web Audio chiptune synth ============ */
const AU={ctx:null,muted:false,mood:'calm',step:0,next:0};
function audioInit(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  const c=AU.ctx=new AC();
  AU.master=c.createGain();AU.master.gain.value=AU.muted?0:1;
  const comp=c.createDynamicsCompressor();AU.master.connect(comp);comp.connect(c.destination);
  AU.mus=c.createGain();AU.mus.gain.value=.55;AU.mus.connect(AU.master);
  AU.fx=c.createGain();AU.fx.gain.value=.7;AU.fx.connect(AU.master);
  const d=c.createDelay(1),fb=c.createGain(),lp=c.createBiquadFilter();
  d.delayTime.value=.34;fb.gain.value=.3;lp.type='lowpass';lp.frequency.value=1700;
  AU.send=c.createGain();AU.send.gain.value=.4;AU.send.connect(d);d.connect(lp);lp.connect(fb);fb.connect(d);lp.connect(AU.mus);
  const nb=c.createBuffer(1,c.sampleRate,c.sampleRate),ch=nb.getChannelData(0);
  for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;AU.nbuf=nb;
  AU.next=c.currentTime+.15;setInterval(sched,60);
}
const now=()=>AU.ctx?AU.ctx.currentTime:0;
const mtof=m=>440*Math.pow(2,(m-69)/12);
function tone(o){const c=AU.ctx;if(!c)return;const t=o.t||c.currentTime,osc=c.createOscillator(),g=c.createGain(),v=o.v||.2;
  osc.type=o.type||'triangle';osc.frequency.setValueAtTime(o.f,t);
  if(o.to)osc.frequency.exponentialRampToValueAtTime(o.to,t+o.d);
  if(o.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=5.2;lg.gain.value=o.vib;
    l.connect(lg);lg.connect(osc.frequency);l.start(t);l.stop(t+o.d+.1)}
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+(o.a||.006));
  if(o.sus){g.gain.setValueAtTime(v,t+o.d*.7);g.gain.linearRampToValueAtTime(.0001,t+o.d)}
  else g.gain.exponentialRampToValueAtTime(.0001,t+o.d);
  osc.connect(g);g.connect(o.dest||AU.fx);if(o.echo)g.connect(AU.send);
  osc.start(t);osc.stop(t+o.d+.05)}
function noise(o){const c=AU.ctx;if(!c)return;const t=o.t||c.currentTime,s=c.createBufferSource(),g=c.createGain(),fl=c.createBiquadFilter();
  s.buffer=AU.nbuf;s.loop=true;fl.type=o.type||'bandpass';fl.frequency.value=o.f||1000;fl.Q.value=o.q||1;
  g.gain.setValueAtTime(o.v||.2,t);g.gain.exponentialRampToValueAtTime(.0001,t+o.d);
  s.connect(fl);fl.connect(g);g.connect(o.dest||AU.fx);s.start(t,Math.random()*.5);s.stop(t+o.d+.05)}
/* --- score: D Hijaz (Phrygian dominant), 16 bars of 16 steps --- */
const SC=[0,1,4,5,7,8,10],DT=.17;
const deg=(n,root)=>root+12*Math.floor(n/7)+SC[((n%7)+7)%7];
const LY={A:[0,-1,4,-1,7,-1,4,-1,0,-1,4,-1,8,-1,7,-1],B:[3,-1,5,-1,7,-1,5,-1,3,-1,5,-1,9,-1,7,-1],
  C:[1,-1,3,-1,5,-1,3,-1,1,-1,4,-1,6,-1,4,-1]};
const PROG='AABACABA';
const FL=[[[0,4,6],[6,5,2],[8,4,4],[12,3,2],[14,2,2]],[[0,3,4],[4,2,2],[6,1,2],[8,0,8]],
  [[0,2,4],[4,3,2],[6,4,2],[8,5,4],[12,4,4]],[[0,4,12]],
  [[0,7,6],[6,6,2],[8,5,4],[12,4,4]],[[0,5,2],[2,4,2],[4,3,4],[8,2,4],[12,1,4]],
  [[0,2,3],[3,1,1],[4,0,4],[8,1,2],[10,2,2],[12,1,4]],[[0,0,14]]];
const DRUM={0:'d',2:'t',6:'t',8:'d',12:'t',14:'k'};
function playStep(st,t){const bar=st>>4,s=st&15,m=AU.mood,M=AU.mus;
  if(st%32===0){tone({f:mtof(38),t,d:32*DT+.4,type:'triangle',v:.16,a:.6,sus:1,dest:M});
    tone({f:mtof(45),t,d:32*DT+.4,type:'sine',v:.09,a:.9,sus:1,dest:M})}
  if(m!=='tense'){const n=LY[PROG[bar%8]][s];
    if(n>=0){const f=mtof(deg(n,50));tone({f,t,d:.55,type:'triangle',v:.13,dest:M,echo:1});
      tone({f:f*2,t,d:.18,type:'square',v:.018,dest:M})}}
  else if(s===0||s===10){tone({f:mtof(deg(s?1:0,50)),t,d:1.2,type:'triangle',v:.1,dest:M,echo:1})}
  const dr=DRUM[s];
  if(dr&&(m!=='tense'||dr==='d')){
    if(dr==='d')tone({f:95,to:48,t,d:.22,type:'sine',v:m==='tense'?.3:.22,dest:M});
    else noise({t,d:dr==='t'?.06:.03,v:dr==='t'?.07:.04,f:2600,q:2,dest:M})}
  if(bar>=8&&m!=='tense'){for(const[n0,dg,len]of FL[bar-8])if(n0===s)
    tone({f:mtof(deg(dg,m==='hope'?74:62)),t,d:len*DT*.95,type:'sine',v:.1,a:.05,sus:1,vib:4,dest:M,echo:1})}}
function sched(){const c=AU.ctx;if(!c||c.state!=='running')return;
  if(AU.next<c.currentTime-.5)AU.next=c.currentTime+.05;
  while(AU.next<c.currentTime+.25){playStep(AU.step,AU.next);AU.next+=DT;AU.step=(AU.step+1)%256}}
/* --- sound effects --- */
const SFX={
  click(){tone({f:620,d:.04,type:'square',v:.06})},
  pick(){tone({f:494,d:.08,type:'square',v:.09});tone({f:740,t:now()+.08,d:.14,type:'square',v:.09})},
  nope(){tone({f:160,to:110,d:.16,type:'square',v:.07})},
  step(){noise({d:.05,v:.09,f:500+Math.random()*250,q:1.2,type:'lowpass'})},
  door(){tone({f:90,to:60,d:.25,type:'sawtooth',v:.1});noise({t:now()+.2,d:.09,v:.2,f:300,type:'lowpass'})},
  talk(p){tone({f:p*(.94+Math.random()*.12),d:.045,type:'square',v:.035})},
  sew(){for(let i=0;i<5;i++)noise({t:now()+i*.16,d:.07,v:.12,f:3200,q:4})},
  cut(){for(let i=0;i<3;i++)noise({t:now()+i*.2,d:.14,v:.14,f:1800,q:1})},
  creak(){tone({f:140,to:170,d:.3,type:'sawtooth',v:.05});tone({f:175,to:150,t:now()+.3,d:.3,type:'sawtooth',v:.04})},
  splash(){noise({d:.4,v:.16,f:900,q:.6});tone({f:500,to:900,t:now()+.1,d:.2,type:'sine',v:.05})},
  snuff(){noise({d:.25,v:.1,f:5000,q:.5,type:'highpass'})},
  alert(){tone({f:330,d:.12,type:'square',v:.1});tone({f:311,t:now()+.14,d:.25,type:'square',v:.1})},
  pray(){[62,69,74].forEach((m,i)=>tone({f:mtof(m),t:now()+i*.28,d:2.4-i*.3,type:'sine',v:.11,a:.25,sus:1,echo:1}))},
  good(){[62,66,69,74].forEach((m,i)=>tone({f:mtof(m),t:now()+i*.09,d:.3,type:'triangle',v:.13,echo:1}))},
  win(){[62,66,69,74,78,81].forEach((m,i)=>tone({f:mtof(m),t:now()+i*.16,d:i===5?1.6:.4,type:'triangle',v:.15,echo:1}))}
};
function setMute(m){AU.muted=m;if(AU.master)AU.master.gain.value=m?0:1;
  $('#mute').innerHTML=m?'&#9835; SOUND OFF':'&#9835; SOUND ON';$('#mute').style.opacity=m?.6:1}
$('#mute').onclick=e=>{e.stopPropagation();audioInit();setMute(!AU.muted);SFX.click()};
/* ============ ART: rooms (procedural pixel art) ============ */
const ART={};
function jar(g,x,y,c){R(g,x+1,y-9,6,9,c);R(g,x,y-7,8,5,c);R(g,x+2,y-11,4,2,c);R(g,x+1,y-7,1,4,'rgba(255,220,160,.25)')}
function flame(g,x,y,t,big){const f=Math.floor(t/110)%3,h=(big?5:3)+(f===1?1:0);
  R(g,x-1,y-h+1,3,h,'#e8662a');R(g,x,y-h,1,h,'#ffd24a');if(f===2)R(g,x+1,y-h,1,2,'#ffb030')}

  const m=[];if(!F.gotKnife||!F.gotCloth)m.push('the workbench');if(!F.gotThread)m.push('the shelf');if(!F.gotRope)m.push('the pegs on the wall');if(!F.gotBasket)m.push('the corner by the bench');

  if(!F.longRope)return['braid',['The rope is too short, yet I hold the makings of more. Strands woven together are stronger than one.','I can braid the cloth strips and splice them onto the short rope.']];

/* ---------- Caesarea harbor ---------- */
const SEW=['awl','twine','sailpatch','thread'];
async function mendSail(it){if(!SEW.includes(it))return false;
  if(it==='thread')return say(P,'My thread is for tent seams. A sail under wind would snap it. I need something heavier.');
  if(!has('sailpatch'))return say(P,'The tear is too long to draw closed. It needs a patch of sound sailcloth.');
  if(!has('twine'))return say(P,'I have a patch, but nothing strong enough to sew it on with.');
  return finale2()}
async function lowerSail(){if(!F.metCapt)return say(P,"I should not touch a ship's rigging without her captain's word.");
  await say(P,'Easy... paying it out, hand over hand.');SFX.creak();await fade(1,220);F.sailDown=1;await wait(250);await fade(0,220);SFX.creak();
  await say(CP,'Gently done. You have hauled a line before.');await say(P,'Tent ropes, mostly.')}

  await wait(1500);ov.onclick=()=>location.reload();await new Promise(()=>{})}
function hint2(){
  if(G.room==='upper')return['upper',['I am among brothers at last. There is much to learn here, and then much to do.','When I am ready, the door leads out to the city and its synagogues.']];
  if(G.room==='harbor'){
    if(!F.metCapt)return['capt',['A ship without a sail, and a tentmaker without a passage. Each may be the answer to the other.',"I should speak with the ship's captain."]];
    if(!F.sailDown)return['halyard',['No one can mend what is out of reach.','The halyard at the foot of the mast will lower the sail.']];
    if(!F.gotPatch)return['patch',['Sound cloth is often thrown out with the worn. A trained eye can tell them apart.','I can cut a patch from the heap of old sailcloth by the warehouse.']];
    if(!F.gotTwine)return['twine',['The man who has what I need has a need of his own. Giving comes before receiving.','The old fisherman has not eaten. I could share my provisions with him.']];
    return['sew',['Everything is at hand. Now, the work itself.','I should sew the patch onto the torn sail with the twine and my awl.']]}
  if(F.told)return['door',['I no longer stand alone. A trusted voice is ready to speak for me.','Barnabas waits at the door of the house. I should go and knock.']];
  if(!F.knocked&&!F.metBarn)return['knock',['I came to join the brothers. The first step is the plainest one: ask.','I should knock at the door of the house where the disciples meet.']];
  if(!F.metBarn)return['barn',["My name closes that door. Perhaps a stranger's need will open another. Who nearby could use a pair of hands?",'I should speak with the man struggling with his handcart.']];
  if(!F.wheelOn)return['wheel',['Some loads cannot be lifted alone. That is true of wheels, and of more than wheels.','The loose wheel must go back on the axle. With its owner helping, I can lift it.']];
  if(!F.gotStick)return['stick',['A wheel needs a pin. What does a tentmaker know how to make from a piece of wood?','There is a pruned branch lying under the olive tree.']];
  if(!F.peg)return['peg',['Good wood, but the wrong shape. My hands know the right one.','My knife can shape the olive branch into a peg.']];
  return['fix',['The peg is ready. It belongs where the old pin sheared off.',"I should fit the peg to the handcart's axle."]]}
