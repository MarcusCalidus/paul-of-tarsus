<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c130c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- installed on an iPhone, the game is laid out up to the top edge of the screen (a status bar lies over it, kept clear by the safe margins) -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Paul of Tarsus">
<title>Paul of Tarsus: On the Roads of Rome</title>
<style>
:root{--s:3;--gold:#e2b24c;--hi:#fff3b8;--dim:#8a6628;--ink:#0b0812;--pray:#a8d0f8;--px:calc(var(--s)*.5px);--wood:none}
*{box-sizing:border-box}
html,body{margin:0;height:var(--vh,100%);background:#000;color:#ddd;overflow:hidden;
  font-family:"Lucida Console",Monaco,"Courier New",monospace;font-weight:bold;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center}
#wrap{width:calc(var(--s)*320px);background:#0a0706}
#top,#status,#panel{background:#1c130c var(--wood);background-size:calc(var(--s)*128px) calc(var(--s)*32px);image-rendering:pixelated}
#top{display:flex;justify-content:space-between;align-items:center;height:calc(var(--s)*10px);
  padding:0 calc(var(--s)*3px);font-size:calc(var(--s)*5px);color:#b08a48;letter-spacing:.08em;text-shadow:var(--px) var(--px) 0 #000;
  box-shadow:inset 0 calc(var(--px)*-1) 0 #000,inset 0 calc(var(--px)*-2) 0 #6a4c24}
#top button{font:inherit;color:var(--gold);background:rgba(10,6,4,.55);border:var(--px) solid var(--dim);text-shadow:inherit;
  padding:0 calc(var(--s)*3px);height:calc(var(--s)*8px);cursor:pointer}
#top button:hover{color:var(--hi);border-color:var(--gold)}
#top #names.on{color:#fff;border-color:var(--gold);background:rgba(168,98,30,.66)}
#top #names::before{content:'';display:inline-block;vertical-align:middle;width:calc(var(--s)*2px);height:calc(var(--s)*2px);border-radius:50%;
  background:var(--gold);box-shadow:0 0 0 var(--px) #000;margin:0 calc(var(--s)*1.5px) calc(var(--s)*.5px) 0}
#view{position:relative;width:calc(var(--s)*320px);height:calc(var(--s)*144px);overflow:hidden;cursor:default}
#view.plan{touch-action:none}   /* on a lane map two fingers zoom the view, not the page */
/* the canvas is as tall as the title's picture, 210 room pixels: a room is painted into its upper 144, which is all the view shows in play */
#screen{width:100%;height:calc(var(--s)*210px);display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#speech{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:3}
.line{position:absolute;transform:translateX(-50%);text-align:center;width:max-content;
  max-width:calc(var(--s)*200px);font-size:calc(var(--s)*6.2px);line-height:1.25;
  text-shadow:calc(var(--s)*1px) 0 #000,calc(var(--s)*-1px) 0 #000,0 calc(var(--s)*1px) #000,0 calc(var(--s)*-1px) #000,
   calc(var(--s)*1px) calc(var(--s)*1px) #000,calc(var(--s)*-1px) calc(var(--s)*1px) #000,calc(var(--s)*1px) calc(var(--s)*-1px) #000,calc(var(--s)*-1px) calc(var(--s)*-1px) #000}
/* where the browser can paint a stroke behind the letters, the edge is that stroke, a room pixel wide outside every letter and even on
   its curves; eight shifted shadows leave steps there. A browser that cannot keeps the shadows above. */
@supports (paint-order:stroke fill){.line{text-shadow:none;-webkit-text-stroke:calc(var(--s)*2px) #000;paint-order:stroke fill}}
/* a speaker who is not in the picture is named before his words (say) */
.line[data-who]::before{content:attr(data-who) " ";opacity:.75}
.line[data-who]::first-letter{text-transform:uppercase}
/* a line of narration told in the dark is read from the narrator's scroll (shared/scroll.js): it stands in ink in the middle of the open
   part of the roll, in a size that suits its length, and a reference in it is never divided over two lines */
.line.ink{left:calc(var(--s)*170px);top:50%;transform:translate(-50%,-50%);max-width:calc(var(--s)*164px);text-align:left;text-wrap:balance;
  color:#2c1a0e;opacity:.94;text-shadow:none;-webkit-text-stroke:0;paint-order:normal;letter-spacing:.01em;animation:ink .35s ease-out}
.line.ink span{white-space:nowrap}
/* a line told on the white screen on the road to Damascus stands in dark ink, centered, with no dark edge */
.line.white{left:50%;top:50%;transform:translate(-50%,-50%);max-width:calc(var(--s)*230px);text-wrap:balance;
  color:#1c140e;text-shadow:none;-webkit-text-stroke:0;paint-order:normal}
@keyframes ink{from{opacity:0}}
#scroll{position:absolute;z-index:2;inset:0;width:100%;height:100%;opacity:0;pointer-events:none;image-rendering:pixelated;image-rendering:crisp-edges}
#tags{position:absolute;inset:0;pointer-events:none;z-index:3;display:none}
#tags.on{display:block}
.tag{position:absolute;transform:translateX(-50%);font-size:calc(var(--s)*4.4px);line-height:1.25;color:#f0e2c0;white-space:nowrap;
  padding:0 calc(var(--s)*1.5px);background:rgba(10,6,4,.66);text-shadow:var(--px) var(--px) 0 #000;margin-top:calc(var(--s)*2.5px)}
.tag::before{content:'';position:absolute;left:50%;top:calc(var(--s)*-3px);width:calc(var(--s)*2px);height:calc(var(--s)*2px);
  margin-left:calc(var(--s)*-1px);border-radius:50%;background:var(--gold);box-shadow:0 0 0 var(--px) #000}
.tag.exit::before{background:#9fd8b0}.tag.who::before{background:#f0a8a0}
#tags.pin .tag{pointer-events:auto;cursor:pointer}
#dim{position:absolute;z-index:2;inset:0;background:#05030c;opacity:0;pointer-events:none;transition:opacity .9s ease-in-out}
#hush{position:absolute;z-index:6;top:calc(var(--s)*3px);right:calc(var(--s)*3px);display:none;pointer-events:none;max-width:calc(var(--s)*170px);
  padding:calc(var(--s)*2px) calc(var(--s)*4px);font-size:calc(var(--s)*4.6px);line-height:1.35;color:#f0e2c0;text-align:right;
  background:rgba(10,6,4,.86);border:var(--px) solid var(--dim);box-shadow:0 calc(var(--px)*2) calc(var(--s)*3px) rgba(0,0,0,.7);text-shadow:var(--px) var(--px) 0 #000}
#hush.on{display:block}
/* the notice of a hidden treasure found: small, at the top left, and gone by itself (see treasure) */
#found{position:absolute;z-index:6;top:calc(var(--s)*3px);left:calc(var(--s)*3px);pointer-events:none;max-width:calc(var(--s)*170px);
  padding:calc(var(--s)*2px) calc(var(--s)*4px);font-size:calc(var(--s)*4.6px);line-height:1.35;color:#f0e2c0;text-align:left;
  background:rgba(10,6,4,.86);border:var(--px) solid var(--gold);box-shadow:0 calc(var(--px)*2) calc(var(--s)*3px) rgba(0,0,0,.7);text-shadow:var(--px) var(--px) 0 #000;
  opacity:0;transform:translateY(calc(var(--s)*-2px));transition:opacity .4s,transform .4s;visibility:hidden}
#found.on{opacity:1;transform:none;visibility:visible}
#found b{color:var(--hi);font-weight:normal}
#overlay{position:absolute;z-index:4;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:calc(var(--s)*8px);cursor:pointer}
#overlay.on{display:flex}
#overlay h1{margin:0;font-size:calc(var(--s)*17px);line-height:1;color:var(--gold);letter-spacing:.04em;
  text-shadow:0 calc(var(--s)*1px) #7a3b12,0 calc(var(--s)*2px) #3a1608,calc(var(--s)*2px) calc(var(--s)*3px) #000}
#overlay h2{margin:calc(var(--s)*3px) 0;font-size:calc(var(--s)*8px);color:#f0e2c0;letter-spacing:.2em;
  text-shadow:calc(var(--s)*1px) calc(var(--s)*1px) #000}
/* the title's logo is a painting (shared/logo.js): one canvas pixel is half a room pixel, as in the view */
#overlay h1.art{font-size:0;text-shadow:none}
#overlay .logo{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#overlay p{margin:calc(var(--s)*2px) 0;font-size:calc(var(--s)*5.4px);line-height:1.35;color:#d8cfe8;
  max-width:calc(var(--s)*270px);text-shadow:calc(var(--s)*1px) calc(var(--s)*1px) #000}
#overlay .small{font-size:calc(var(--s)*4.4px);color:#a99cc0}
/* an end screen whose text would run past the bottom of the view (a long German note, a code line under it) sets its small print and its
   spacing a little tighter (endScreen adds .tight only then); every other screen keeps the sizes above */
#overlay.tight p{margin:calc(var(--s)*1.2px) 0;line-height:1.25}
#overlay.tight .small{font-size:calc(var(--s)*4px)}
#overlay.tight h2{margin:calc(var(--s)*1.5px) 0}
/* and one that still runs over (Chapter Eighteen's long German note with the code that leads on to Nineteen) a step tighter again */
#overlay.tighter p{margin:calc(var(--s)*.8px) 0;line-height:1.18;font-size:calc(var(--s)*5px)}
#overlay.tighter .small{font-size:calc(var(--s)*3.7px)}
#overlay.tighter .go{margin:calc(var(--s)*1.4px) 0}
#overlay.tighter h1{margin:calc(var(--s)*1px) 0}
#overlay .go{color:var(--hi);animation:bl 1.1s steps(2) infinite}
#overlay .go,#overlay .pick{font-size:calc(var(--s)*6.2px);margin:calc(var(--s)*2.5px) 0}
/* the title screen's chapters scroll in a box that takes whatever room the title leaves; an entry that runs past its top or bottom
   edge fades out over a band of the box, and the band is there only while there is more to scroll that way */
@property --ft{syntax:'<length>';inherits:false;initial-value:0px}
@property --fb{syntax:'<length>';inherits:false;initial-value:0px}
#overlay .chs{flex:0 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;
  padding:0 calc(var(--s)*4px);--ft:0px;--fb:0px;transition:--ft .35s,--fb .35s;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 var(--ft),#000 calc(100% - var(--fb)),transparent);
  mask-image:linear-gradient(to bottom,transparent,#000 var(--ft),#000 calc(100% - var(--fb)),transparent)}
#overlay .chs::-webkit-scrollbar{display:none}
#overlay .chs.up{--ft:calc(var(--s)*14px)}
#overlay .chs.down{--fb:calc(var(--s)*14px)}
#overlay .chs p{margin-left:auto;margin-right:auto}
#overlay h1,#overlay h2,#overlay p{flex-shrink:0}
#overlay .pick{color:var(--gold)}
#overlay .pick:hover{color:#fff}
/* the planned chapters (PLANNED): a muted line that opens them, and the chapters themselves, dimmed, which cannot be clicked */
#overlay .plans{color:#a99cc0;cursor:pointer}
#overlay .plans:hover{color:#fff}
#overlay .plan{display:none;color:#8a7ea0;cursor:default}
#overlay .chs.open .plan{display:block}
#overlay .langs span{cursor:pointer;padding:0 calc(var(--s)*1.5px)}
#overlay .langs span:hover{color:#fff}
#overlay .langs span.on{color:var(--gold)}
#overlay.end{background:rgba(6,4,14,.82)}
#overlay.card{background:rgba(6,4,14,.62)}
#overlay.card h2{margin:0 0 calc(var(--s)*2px)}
#overlay.card h1{font-size:calc(var(--s)*12px);margin:0;padding:calc(var(--s)*2px) calc(var(--s)*8px);border-top:var(--px) solid var(--dim);border-bottom:var(--px) solid var(--dim)}
#overlay.card h1.art{font-size:0;padding:0;border:0}
/* full: a menu, the safe point or an end screen owns the screen. The status line and the panel slide down out of sight and keep their
   place, so that the picture does not move, and slide back when play goes on. */
#wrap{overflow:hidden;background:#3a2a1c var(--wood);background-size:calc(var(--s)*128px) calc(var(--s)*32px);background-blend-mode:multiply;image-rendering:pixelated}
#status,#panel{transition:transform .45s ease-in-out,opacity .45s ease-in-out}
#wrap.full #status,#wrap.full #panel{transform:translateY(calc(var(--s)*70px));opacity:0;pointer-events:none}
#wrap.full #top>span:first-child{visibility:hidden}
/* title: the title screen alone uses the whole height. The status line and the panel give up their place to the view, which runs down to
   the foot of the window, and the title's picture is painted that tall (see VT). When the title is left the view is as it always is, and
   the upper part of the picture has not moved. A menu or the code box opened over the title covers all of it. */
#wrap.title #view{height:calc(var(--s)*210px)}
#wrap.title #status,#wrap.title #panel{display:none}
/* with that height the title holds its prologue, sixteen chapters and the line of the planned ones without scrolling (the lines stand
   a little closer than they did for fifteen); the list still scrolls when there are more lines than room, as it does when the planned
   chapters are opened */
#overlay.title{padding-top:calc(var(--s)*5px);padding-bottom:calc(var(--s)*5px)}
#overlay.title .chs p{margin:0 auto;font-size:calc(var(--s)*5.6px);line-height:1.1}
/* splash: the opening picture (shared/splash.js). The title is laid out as it always is, so that its name does not move when the chapters
   appear, but only the name and the line under it are seen; the rest comes in when the splash is left. begin: the one line that asks for a click,
   seen until the overture starts. */
#overlay.title>*{transition:opacity 1.6s ease-in-out}
/* a line that blinks (Continue, on a return) would blink through: its blinking sets its opacity, so it is stopped here too */
#overlay.splash>:not(h1):not(.lede):not(.begin){opacity:0;pointer-events:none;animation:none}
#overlay .begin{position:absolute;left:0;right:0;bottom:calc(var(--s)*9px);margin:0 auto;opacity:0;pointer-events:none;transition:opacity .5s}
#overlay.splash:not(.playing) .begin{opacity:1}
/* tight: a long chapter name beside a long code and every button leaves no room for the game's name; the chapter's name stays */
#top.tight #gname,#top.tight #gdot{display:none}
@keyframes bl{50%{opacity:.25}}
#status{height:calc(var(--s)*11px);line-height:calc(var(--s)*11px);text-align:center;
  font-size:calc(var(--s)*6.2px);color:var(--hi);white-space:nowrap;overflow:hidden;text-shadow:var(--px) var(--px) 0 #000;background-blend-mode:multiply;background-color:#5a4630;
  border-top:calc(var(--s)*1px) solid #6a4c24;border-bottom:calc(var(--s)*1px) solid #0a0604;box-shadow:inset 0 var(--px) 0 #000}
#panel{display:flex;height:calc(var(--s)*53px);padding:calc(var(--s)*2px);gap:calc(var(--s)*3px);position:relative}
#verbs{width:46%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:calc(var(--s)*1px)}
#verbs button,#choices button{font:inherit;font-size:calc(var(--s)*6.2px);color:var(--gold);background:rgba(14,8,5,.62);
  border:0;cursor:pointer;padding:0;text-align:center;text-shadow:var(--px) var(--px) 0 #000;
  box-shadow:inset var(--px) var(--px) 0 rgba(255,214,140,.26),inset calc(var(--px)*-1) calc(var(--px)*-1) 0 rgba(0,0,0,.7)}
#verbs button:hover{color:var(--hi);background:rgba(96,62,28,.6)}
#verbs button:active:not(:disabled){transform:translateY(var(--px));box-shadow:inset var(--px) var(--px) 0 rgba(0,0,0,.75),inset calc(var(--px)*-1) calc(var(--px)*-1) 0 rgba(255,214,140,.2)}
#verbs button.sel{color:#fff;background:rgba(168,98,30,.66);box-shadow:inset var(--px) var(--px) 0 rgba(0,0,0,.6),inset calc(var(--px)*-1) calc(var(--px)*-1) 0 rgba(255,214,140,.3)}
#verbs button.def{color:var(--hi);background:rgba(52,36,16,.72);box-shadow:inset 0 0 0 var(--px) rgba(226,178,76,.9),inset 0 0 0 calc(var(--px)*2) rgba(0,0,0,.55)}
#verbs #pray{grid-column:1/4;color:var(--pray);background:rgba(14,32,70,.78);letter-spacing:.06em}
#verbs #pray:hover{color:#fff;background:rgba(30,60,116,.82)}
#verbs #swap{display:none;color:#f4d8a0;background:rgba(88,48,22,.78);letter-spacing:.02em}
#verbs #swap:hover{color:#fff;background:rgba(130,74,30,.85)}
#verbs #swap:disabled,#verbs #swap:disabled:hover{color:#8a7a62;background:rgba(48,32,20,.6);cursor:default}
#verbs.party #pray{grid-column:1/3}#verbs.party #swap{display:block}
#inv{flex:1;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);gap:calc(var(--s)*1px)}
#inv .slot{background:rgba(8,5,4,.66);display:flex;align-items:center;justify-content:center;cursor:pointer;outline:0 solid var(--gold);
  box-shadow:inset var(--px) var(--px) 0 rgba(0,0,0,.75),inset calc(var(--px)*-1) calc(var(--px)*-1) 0 rgba(255,214,140,.2)}
#inv .slot:hover{background:rgba(96,62,28,.5)}
#inv .slot.sel{outline-width:calc(var(--s)*1px);outline-offset:calc(var(--s)*-1px);background:rgba(168,98,30,.5)}
#inv .slot.glow{animation:invglow .5s ease-out}
@keyframes invglow{0%{box-shadow:inset 0 0 calc(var(--s)*5px) var(--hi),0 0 calc(var(--s)*3px) var(--gold);background:rgba(226,178,76,.45)}100%{box-shadow:inset var(--px) var(--px) 0 rgba(0,0,0,.75),inset calc(var(--px)*-1) calc(var(--px)*-1) 0 rgba(255,214,140,.2)}}
.flyitem{position:fixed;pointer-events:none;z-index:20;image-rendering:pixelated;image-rendering:crisp-edges}
#inv canvas{height:calc(var(--s)*24px);width:calc(var(--s)*24px);image-rendering:pixelated;image-rendering:crisp-edges;pointer-events:none}
#choices{position:absolute;inset:calc(var(--s)*2px);display:none;flex-direction:column;gap:calc(var(--s)*1px);
  background:#120c08;overflow:auto}
#choices.on{display:flex}
#choices button{text-align:left;padding:0 calc(var(--s)*4px);flex:0 0 calc(var(--s)*7.2px);line-height:calc(var(--s)*7.2px);font-size:calc(var(--s)*5.4px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#choices button:hover{color:var(--hi);background:rgba(96,62,28,.6)}
#panel.locked #verbs,#panel.locked #inv{opacity:.35;pointer-events:none}
#top button{margin-left:calc(var(--s)*2px)}
#codebox{position:absolute;z-index:5;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--s)*3px);
  background:rgba(6,4,14,.92);text-align:center;cursor:default;padding:calc(var(--s)*8px)}
#codebox.on{display:flex}
#codebox h2{margin:0;font-size:calc(var(--s)*9px);color:var(--gold);letter-spacing:.2em}
#codebox p{margin:0;font-size:calc(var(--s)*5.2px);color:#d8cfe8;max-width:calc(var(--s)*250px);line-height:1.3}
#codebox .big{font-size:calc(var(--s)*17px);line-height:1.1;color:var(--hi);letter-spacing:.12em;-webkit-user-select:text;user-select:text;
  text-shadow:0 calc(var(--s)*1px) #7a3b12,calc(var(--s)*1px) calc(var(--s)*2px) #000}
#codebox .row{display:flex;gap:calc(var(--s)*2px)}
#codebox input{font:inherit;font-size:calc(var(--s)*8px);width:calc(var(--s)*104px);text-align:center;text-transform:uppercase;background:#150f26;
  color:var(--hi);border:calc(var(--s)*1px) solid var(--dim);padding:calc(var(--s)*2px);letter-spacing:.1em;outline:none;-webkit-user-select:text;user-select:text}
#codebox input:focus{border-color:var(--gold)}
#codebox button{font:inherit;font-size:calc(var(--s)*6px);color:var(--gold);background:#1b1330;border:calc(var(--s)*1px) solid var(--dim);
  padding:calc(var(--s)*2px) calc(var(--s)*5px);cursor:pointer}
#codebox button:hover{color:var(--hi);border-color:var(--gold)}
#codebox .small{font-size:calc(var(--s)*4.8px);color:#f0a090;min-height:1.3em}
#codebox .kept{font-size:calc(var(--s)*4.4px);color:#a99cc0}
#menu{position:absolute;z-index:5;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--s)*2.5px);
  background:rgba(6,4,14,.92);text-align:center;cursor:default;padding:calc(var(--s)*6px)}
#menu.on{display:flex}
#menu h2{margin:0 0 calc(var(--s)*1px);font-size:calc(var(--s)*9px);color:var(--gold);letter-spacing:.2em}
#menu .row{display:flex;align-items:center;justify-content:space-between;width:calc(var(--s)*210px);gap:calc(var(--s)*4px);font-size:calc(var(--s)*5.4px);color:#d8cfe8}
#menu .row label{text-align:left;color:#f0e2c0}
#menu input[type=range]{width:calc(var(--s)*88px);accent-color:var(--gold);cursor:pointer}
#menu .seg{display:flex;gap:calc(var(--s)*1.5px)}
#menu button{font:inherit;font-size:calc(var(--s)*5.4px);color:var(--gold);background:#1b1330;border:calc(var(--s)*1px) solid var(--dim);
  padding:calc(var(--s)*1.2px) calc(var(--s)*3.5px);cursor:pointer}
#menu button:hover{color:var(--hi);border-color:var(--gold)}
#menu button.on{color:#fff;background:rgba(168,98,30,.66);border-color:var(--gold)}
#menu .acts{display:flex;gap:calc(var(--s)*3px);margin-top:calc(var(--s)*2px)}
#menu .slot{width:calc(var(--s)*232px);font-size:calc(var(--s)*4.8px);padding:calc(var(--s)*1.2px) calc(var(--s)*2px);background:rgba(27,19,48,.6);
  border-left:calc(var(--s)*1px) solid var(--dim)}
#menu .sl{display:grid;grid-template-columns:auto 1fr;column-gap:calc(var(--s)*3px);align-items:baseline;text-align:left;min-width:0}
#menu .sl b{font-weight:normal;color:#f0e2c0}
#menu .sl small{font-size:calc(var(--s)*3.9px);color:#8a7ea0}
#menu .tres{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--s)*1.5px);width:calc(var(--s)*232px)}
#menu .tre{min-height:calc(var(--s)*15px);padding:calc(var(--s)*1px) calc(var(--s)*2px);background:rgba(27,19,48,.6);border-left:calc(var(--s)*1px) solid var(--dim);

<script>
"use strict";
/* Paul of Tarsus: On the Roads of Rome. This file is the engine: layout, the paint toolkit, figures, the audio sequencer,
   verbs and inventory, safe-point codes and the level loader. Each chapter (its music, artwork, cast, rooms and dialog)
   is a separate file under levels/, loaded on demand. */
/* ============ CORE ============ */
const VW=320,VH=144,VT=210;   /* the view; VT: the height of the title's picture, which is the view, the status line and the panel together */
const $=s=>document.querySelector(s);
const cv=$('#screen'),cx=cv.getContext('2d');
cx.imageSmoothingEnabled=false;
const G={ch:1,ship:null,room:null,verb:'walk',item:null,busy:true,flags:{},inv:[],cam:0,camY:0,zoom:1,zoomTo:1,t:0,scene:null,
  hover:null,prays:0,hintAt:{},skip:null,started:0,dialog:false,pc:null,invs:{},lang:'en',turn:new Map(),turnN:0};
const OPTS_KEY='paul.opts',OPTS={mus:1,fx:1,spd:1,mov:1,lay:'auto'};   /* mov: 1 lively, 0 calm (see moves); lay: the layout, auto, phone or classic (see fit) */
/* ============ LANGUAGES: every language is data under lang/, English as well ============ */
/* The code never holds a line of text: it holds a key, and every line is looked up as it is shown, by say and narr, choose, the status
   line, the labels, the overlays, the tablets and the map. So the story's logic (its flags, and the names it compares) never sees a
   translation, and a safe-point code is the same in every language. A language is a folder lang/xx/ of files that call
   TEXTS(xx, part, {key: text}): main.js for the engine and the files under shared/, prologue.js, and chapterN.js for each chapter, loaded
   with that chapter. English (lang/en/) is the language the others are translated from, and is always loaded beside the player's. In
   another language an entry is [text, fingerprint]: the fingerprint of the English line it was made from, which tools/strings.mjs
   compares with the English as it stands now. To add a language, add its line to LANGS and write its folder. A key with no text in the
   player's language is shown in English, and one with none at all is shown as it is; either is noted in MISSING (the playtest checks
   that it stays empty). A translation may leave out a {slot} of its English line, but may not add one. */
const LANGS={en:{native:'English',dir:'lang/en/'},de:{native:'Deutsch',dir:'lang/de/'}};   /* native: the language's name in itself */
const DICT={},MISSING=new Set(),MADE=new Set();
function TEXTS(lang,part,d){const L=DICT[lang]||(DICT[lang]={}),P=L[part]||(L[part]={});for(const k in d){const v=d[k];P[k]=Array.isArray(v)?v[0]:v}}
/* textOf: a key's text in one language, from the current chapter's text, then the prologue's, then the engine's; null if it has none */
function textOf(lang,s){const L=DICT[lang];if(!L)return null;const c=L[G.ch]&&L[G.ch][s];if(c!=null)return c;
  const p=L.prologue&&L.prologue[s];if(p!=null)return p;const m=L.main&&L.main[s];return m!=null?m:null}
/* T: a line in the player's language, else in English; vars fill its {slots}.
   What T returns is noted in MADE, so that a line put together from translated parts is not translated twice. */
function T(s,vars){if(typeof s!=='string')return s;let r=s;
  if(!MADE.has(s)){const t=textOf(G.lang,s);if(t!=null)r=t;else{const e=G.lang==='en'?null:textOf('en',s);if(e!=null)r=e;
    if(!MISSING.has(G.ch+': '+s)){MISSING.add(G.ch+': '+s);console.warn(`No ${G.lang} text for: ${s}`)}}}
  if(vars)r=r.replace(/\{(\w+)\}/g,(m,k)=>vars[k]!=null?vars[k]:m);
  MADE.add(r);return r}
/* words: the words of a key ("door_to_the_street": "door to the street"), for logic that looks at what a thing is called */
const words=k=>String(k).replace(/_/g,' ');
/* T.peek: a key's text in the player's language, or null, without noting it as missing (for tests). */
T.peek=s=>textOf(G.lang,s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const VERBS=[['look','look_at'],['pickup','pick_up'],['use','Use'],['open','Open'],['talk','talk_to'],['give','Give']];
const VNAME={walk:'walk_to',look:'look_at',pickup:'pick_up',use:'Use',open:'Open',talk:'talk_to',give:'Give'};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

   all round it, so that it shows in a night scene and on a sunlit wall alike. The browser's own crosshair is thin and easily lost, and it is
   a cross (CONTRIBUTING section 3). h is the lit edge, g the gold and d the shade; the tip is the first pixel. */
const PTR=['h','hg','hgg','hggg','hgggg','hggggg','hgggggg','hggggggg','hgggggggg','hggggggggg','hggggggdddd','hgggggd','hgg.ggd','hg..ggd','h....ggd','.....ggd','......ggd','......ggd'],
  PTRS={
    default:PTR,hot:PTR,
    left:['......hh','.....hhg','....hhgg','...hhggg','..hhgggg','.hhggggg','hhggggggggggggg','ddggggggggggggd','.ddgggggdddddd.','..ddggggd......','...ddgggd......','....ddggd......','.....ddgd......','......ddd......'],
    right:['.......hh......','.......hgg.....','.......hggg....','.......hgggg...','.......hggggg..','.......hgggggg.','hhhhhhhhggggggh','dddddddgggggggd','.......dggggdd.','.......dgggdd..','.......dggdd...','.......dgdd....','.......ddd.....'],
    up:['......h......','.....hgh.....','....hgggh....','...hgggggh...','..hgggggggh..','.hgggggggggh.','hgggggggggggh','ddddgggggdddd','....dgggd....','....dgggd....','....dgggd....','....dgggd....','....ddddd....'],
    down:['....hhhhh....','....hgggd....','....hgggd....','....dgggd....','....dgggd....','hhhhdgggdhddd','hgggggggggggd','.hgggggggggd.','..hgggggggd..','...hgggggd...','....hgggd....','.....hgd.....','......d......'],
    /* While a verb is chosen, the pointer shows it: a magnifying glass for Look at, an open hand for Pick up, a pointing hand for Use,
       a key for Open, two speech balloons for Talk to, and a hand holding out a purse for Give. o is a deeper shade and k near-black. */

  const cell=n=>{const t=CHAP[n].treasure;if(s.has(n))return`<div class="tre got"><small>${esc(T(CHAP[n].label))}</small><b>${esc(T(t.name))}</b></div>`;
    if(n>far)return'<div class="tre"></div>';
    const btn=(a,l)=>`<button type="button" data-t="${n}" data-a="${a}">${esc(l)}</button>`;
    return'<div class="tre">'+(ask.k===n?'<em>'+esc(T('leave_this_game'))+'</em><div class="seg">'+btn('yes',T('Yes'))+btn('no',T('No'))+'</div>':btn('go',T('look_for_it')))+'</div>'};
  mn.innerHTML='<h2>'+esc(T('hidden_treasures_caps'))+'</h2><p class="tsum">'+esc(T('n_of_all_found',{n:s.size,all:all.length}))+'</p>'+
    '<div class="tres">'+all.map(cell).join('')+'</div>'+
    (s.size?'<p class="tcode">'+esc(T('code_for_the_treasures_found'))+' <b>'+treasCode(s)+'</b><br>'+esc(T('type_it_under_enter_code'))+'</p>':'')+
    '<div class="acts"><button type="button" id="tre-x">'+esc(T('Back'))+'</button></div>';
  $('#tre-x').onclick=()=>{SFX.click();if(mn.only)return closeMenu();mn.view='opts';mn.ask=null;mn.draw()};
  mn.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>treasureGo(+b.dataset.t,b.dataset.a))}
async function treasureGo(n,a){if(a==='no'){SFX.click();mn.ask=null;return mn.draw()}
  if(a==='go'&&mn.inGame){SFX.click();mn.ask={k:n,a};return mn.draw()}
  mn.ask=null;const t=CHAP[n].treasure;mn.classList.remove('on');mn.view='opts';
  if(await restore(t.at,1)===false){SFX.nope();mn.classList.add('on');mn.view='treasures';mn.draw()}}
function codeBtn(){const on=G.room&&!G.scene,code=on&&makeCode();if(on)autosave(code);$('#code').textContent=on?T('code_code',{code}):T('enter_code')}
function closeCode(){cb.classList.remove('on');G.busy=cb.was;if(!G.busy)lock(false);status()}
const BADCODE='that_code_is_not_valid';
async function tryCode(){const ts=treasDecode($('#codein').value);
  /* a treasure code: what it holds is added to what is kept here, and the box stays open */
  if(ts){const n=keepTreasures([...ts].filter(x=>CHAP[x]&&CHAP[x].treasure));SFX.good();$('#codemsg').textContent=(n?T('hidden_treasures_added_n',{n})+' ':'')+T('n_of_all_found',{n:treasures().size,all:hidden().length});
    if(ov.classList.contains('title'))ov.draw();return}
  const b=decode($('#codein').value);
  if(b==null){SFX.nope();$('#codemsg').textContent=T(BADCODE);return}
  try{await loadLevel(b.ch)}catch(e){SFX.nope();$('#codemsg').textContent=e.message;return}
  if(b.w!=null&&!unpackWide(CHAP[b.ch],b.w)){SFX.nope();$('#codemsg').textContent=T(BADCODE);return}
  cb.classList.remove('on');AU.key=CHAP[b.ch].music;SFX.good();G.typing=true;let r;try{r=applyState(b)}finally{G.typing=false}if(r!==false&&atStart(b))await showCard(b.ch)}
function openCode(){audioInit();if(cb.classList.contains('on'))return closeCode();
  const can=G.room&&!G.scene&&!G.busy;if(!can&&!ov.classList.contains('on')){SFX.nope();return}
  SFX.click();cb.was=G.busy;G.busy=true;lock(true);status();
  /* drawn again, with what has been typed so far, when the language changes */
  cb.draw=()=>{const typed=$('#codein')?$('#codein').value:'';
    cb.innerHTML=(can?'<h2>'+T('safe_point')+'</h2><p>'+T('your_code_for_this_exact')+'</p><div class="big">'+makeCode()+
        '</div><p>'+T('write_it_down')+'</p>'+
        (G.saved?'<p class="kept">'+T('this_point_is_also_saved')+'</p>':'')
      :'<h2>'+T('enter_code')+'</h2><p>'+T('type_a_code_from_an_earlier')+'</p>')+
      '<div class="row"><input id="codein" maxlength="24" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXX-XXX">'+
      '<button id="codego" type="button">'+T('GO')+'</button></div><p id="codemsg" class="small">&nbsp;</p>'+
      '<button id="codex" type="button">'+(can?T('back_to_the_game'):T('Back'))+'</button>';
    $('#codein').value=typed;$('#codego').onclick=tryCode;$('#codex').onclick=closeCode;
    $('#codein').onkeydown=e=>{if(e.key==='Enter')tryCode();else if(e.key==='Escape')closeCode()}};
  cb.innerHTML='';cb.draw();cb.classList.add('on');if(!can)$('#codein').focus()}
$('#code').onclick=e=>{e.stopPropagation();openCode()};cb.onclick=e=>e.stopPropagation();
/* ============ OPTIONS: volumes, text speed, movement, names, language, back to title (kept in paul.opts, separate from paul.save) ============ */
const mn=$('#menu');
function loadOpts(){try{const o=JSON.parse(store(OPTS_KEY)||'{}');if(typeof o.mus==='number')OPTS.mus=clamp(o.mus,0,1);
  if(typeof o.fx==='number')OPTS.fx=clamp(o.fx,0,1);if(typeof o.spd==='number'&&[1.35,1,.7].includes(o.spd))OPTS.spd=o.spd;
  /* movement: as the player chose; until he has, calm on a device that asks for less motion */
  OPTS.mov=o.mov===0||o.mov===1?o.mov:window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches?0:1;
  if(['auto','phone','classic'].includes(o.lay))OPTS.lay=o.lay}catch(e){}}
function saveOpts(){store(OPTS_KEY,JSON.stringify(OPTS))}
function applyOpts(){if(!AU.ctx)return;if(AU.mus)AU.mus.gain.value=.55*OPTS.mus;if(AU.fx)AU.fx.gain.value=.7*OPTS.fx;if(AU.ambG)AU.ambG.gain.value=.5*OPTS.fx}
function closeMenu(){mn.classList.remove('on');G.busy=mn.was;if(!G.busy)lock(false);status()}
function openMenu(view){audioInit();if(mn.classList.contains('on'))return closeMenu();
  if(cb.classList.contains('on'))closeCode();
  /* in play only between scenes, as Esc: never during a cutscene or a dialogue, which would go on unseen behind it, nor over a title card */
  const inGame=!!(G.room&&!G.scene&&!G.busy&&!ov.classList.contains('on'));
  if(!inGame&&!ov.classList.contains('on')||ov.classList.contains('card')){SFX.nope();return}
  SFX.click();mn.was=G.busy;G.busy=true;lock(true);status();mn.view=typeof view==='string'?view:'opts';mn.only=mn.view!=='opts';mn.ask=null;mn.inGame=inGame;
  mn.draw=()=>{if(mn.view==='saves')return drawSaves();if(mn.view==='treasures')return drawTreasures();const spds=[[1.35,'Slow'],[1,'Normal'],[.7,'Fast']],movs=[[1,'Lively'],[0,'Calm']];
    mn.innerHTML='<h2>'+esc(T('OPTIONS'))+'</h2>'+
      '<div class="row"><label for="opt-mus">'+esc(T('Music'))+'</label><input id="opt-mus" type="range" min="0" max="100" step="10" value="'+Math.round(OPTS.mus*100)+'"></div>'+
      '<div class="row"><label for="opt-fx">'+esc(T('Effects'))+'</label><input id="opt-fx" type="range" min="0" max="100" step="10" value="'+Math.round(OPTS.fx*100)+'"></div>'+
      '<div class="row"><label>'+esc(T('text_speed'))+'</label><div class="seg">'+spds.map(([v,l])=>`<button type="button" data-spd="${v}"${OPTS.spd===v?' class="on"':''}>${esc(T(l))}</button>`).join('')+'</div></div>'+
      '<div class="row"><label>'+esc(T('Movement'))+'</label><div class="seg">'+movs.map(([v,l])=>`<button type="button" data-mov="${v}"${OPTS.mov===v?' class="on"':''}>${esc(T(l))}</button>`).join('')+'</div></div>'+
      '<div class="row"><label>'+esc(T('Names'))+'</label><div class="seg"><button type="button" id="opt-names"'+(G.tagPin?' class="on"':'')+'>'+esc(T(G.tagPin?'On':'Off'))+'</button></div></div>'+
      (Object.keys(LANGS).length>1?'<div class="row"><label>'+esc(T('Language'))+'</label><div class="seg">'+Object.keys(LANGS).map(l=>`<button type="button" data-lang="${l}"${l===G.lang?' class="on"':''}>${esc(LANGS[l].native)}</button>`).join('')+'</div></div>':'')+
      /* the layout: on a device that is touched, or once it has been chosen */
      (touchDev()||OPTS.lay!=='auto'?'<div class="row"><label>'+esc(T('layout'))+'</label><div class="seg">'+[['auto','layout_auto'],['phone','layout_phone'],['classic','layout_classic']].map(([v,l])=>`<button type="button" data-lay="${v}"${OPTS.lay===v?' class="on"':''}>${esc(T(l))}</button>`).join('')+'</div></div>':'')+
      /* on a phone the top bar is not there: the safe-point code is shown and entered from here */
      '<div class="row"><label>'+esc(T('saved_games'))+'</label><div class="seg">'+(PH.on?'<button type="button" id="opt-code">'+esc(inGame?T('code_code',{code:makeCode()}):T('enter_code'))+'</button>':'')+'<button type="button" id="opt-saves">'+esc(T(inGame?'save_load':'Load'))+'</button></div></div>'+
      '<div class="row"><label>'+esc(T('hidden_treasures'))+'</label><div class="seg"><button type="button" id="opt-tre">'+esc(T('n_of_all',{n:treasures().size,all:hidden().length}))+'</button></div></div>'+
      '<div class="acts">'+(inGame?'<button type="button" id="opt-title">'+esc(T('back_to_title'))+'</button>':'')+
      '<button type="button" id="opt-x">'+esc(inGame?T('back_to_the_game'):T('Back'))+'</button></div>';
    $('#opt-mus').oninput=e=>{OPTS.mus=+e.target.value/100;applyOpts();saveOpts()};
    $('#opt-fx').oninput=e=>{OPTS.fx=+e.target.value/100;applyOpts();saveOpts()};
    mn.querySelectorAll('[data-spd]').forEach(b=>b.onclick=()=>{SFX.click();OPTS.spd=+b.dataset.spd;saveOpts();mn.draw()});
    mn.querySelectorAll('[data-mov]').forEach(b=>b.onclick=()=>{SFX.click();OPTS.mov=+b.dataset.mov;saveOpts();mn.draw()});
    mn.querySelectorAll('[data-lay]').forEach(b=>b.onclick=()=>{SFX.click();OPTS.lay=b.dataset.lay;saveOpts();fit();mn.draw()});
    if($('#opt-code'))$('#opt-code').onclick=()=>{SFX.click();closeMenu();openCode()};
    $('#opt-names').onclick=()=>{SFX.click();G.tagPin=!G.tagPin;namesBtn();mn.draw()};
    $('#opt-saves').onclick=()=>{SFX.click();mn.view='saves';mn.ask=null;mn.draw()};
    $('#opt-tre').onclick=()=>{SFX.click();mn.view='treasures';mn.only=false;mn.ask=null;mn.draw()};
    mn.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{SFX.click();setLang(b.dataset.lang,1)});
    if($('#opt-title'))$('#opt-title').onclick=()=>{SFX.click();mn.classList.remove('on');G.room=null;G.scene=null;G.hover=null;title()};
    $('#opt-x').onclick=()=>{SFX.click();closeMenu()}};
  mn.draw();mn.classList.add('on')}
/* drawSaves: the saved games, inside the options menu. One row each for the farthest point, the last point and the four slots, with the
   chapter and when it was kept. Saving needs a point in play; loading works from the title screen and the end of a chapter as well.
   Overwriting, deleting, and loading over a game in play each ask first, in the row itself (mn.ask), never with a browser dialog. */
function drawSaves(){const s=saves(),inGame=mn.inGame,ask=mn.ask||{},
    when=t=>{try{return t?new Date(t).toLocaleString(G.lang,{dateStyle:'medium',timeStyle:'short'}):''}catch(e){return''}},
    E=T('Empty'),L={save:T('Save'),load:T('Load'),del:T('Delete'),yes:T('Yes'),no:T('No')},Q={save:T('overwrite'),del:T('delete_q'),load:T('leave_this_game')},
    btn=(k,a)=>`<button type="button" data-k="${k}" data-a="${a}">${esc(L[a])}</button>`,
    row=(k,name,e,acts)=>{const b=e&&decode(e.code),q=ask.k===k&&ask.a;
      return`<div class="row slot" data-slot="${k}"><div class="sl"><b>${esc(name)}</b>${e?'<small>'+esc(when(e.t))+'</small>':''}`+
        `<span>${b?esc(T(CHAP[b.ch].label))+' &middot; '+esc(T(CHAP[b.ch].title)):'<i>'+esc(E)+'</i>'}</span></div><div class="seg">`+
        (q?`<em>${esc(Q[q])}</em>`+btn(k,'yes')+btn(k,'no')
          :acts.filter(a=>a!=='save'||inGame).filter(a=>a==='save'||e).map(a=>btn(k,a)).join(''))+'</div></div>'};
  const last=saved(),lastE=last?{code:last.code,t:s.last&&s.last.code===last.code?s.last.t:0}:null;
  mn.innerHTML='<h2>'+esc(T('saved_games_caps'))+'</h2>'+row('far',T('farthest_point'),s.far,['load','del'])+row('last',T('last_point'),lastE,['load'])+
    s.slots.map((e,i)=>row(i,T('slot_n',{n:i+1}),e,['save','load','del'])).join('')+
    '<div class="acts"><button type="button" id="sav-x">'+esc(T('Back'))+'</button></div>';
  $('#sav-x').onclick=()=>{SFX.click();mn.view='opts';mn.ask=null;mn.draw()};
  mn.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const k=b.dataset.k,a=b.dataset.a;slotDo(k==='far'||k==='last'?k:+k,a)})}
/* slotDo: what a button of the saved games does. A first press of save over a kept game, of delete, or of load in play asks; yes does it. */
async function slotDo(k,a){const s=saves(),e=k==='far'?s.far:k==='last'?(saved()&&{code:saved().code}):s.slots[k];
  if(a==='no'){SFX.click();mn.ask=null;return mn.draw()}
  if(a==='yes'){a=mn.ask&&mn.ask.k===k?mn.ask.a:null;mn.ask=null;if(!a)return mn.draw();a='!'+a}
  else if(a==='del'||a==='save'&&e||a==='load'&&mn.inGame){SFX.click();mn.ask={k,a};return mn.draw()}
  else a='!'+a;
  if(a==='!save'){if(!mn.inGame||!G.room||G.scene){SFX.nope();return mn.draw()}s.slots[k]={code:makeCode(),t:Date.now()};keepSaves(s);SFX.good();return mn.draw()}
  if(a==='!del'){if(k==='far')s.far=null;else if(k!=='last')s.slots[k]=null;keepSaves(s);SFX.click();return mn.draw()}
  if(a==='!load'){if(!e)return mn.draw();mn.classList.remove('on');mn.view='opts';
    if(await restore(e.code)===false){SFX.nope();mn.classList.add('on');mn.view='saves';mn.draw()}}}
$('#opts').onclick=$('#optsT').onclick=e=>{e.stopPropagation();openMenu()};mn.onclick=e=>e.stopPropagation();
/* rotateIcon: the picture on the card that asks for a phone held upright to be turned: a phone lying on its side, and an arrow that
   curves over it, painted in whole pixels in the colors of the panel */
function rotateIcon(){const c=$('#rotate canvas'),g=c.getContext('2d'),P=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(x,y,w,h)};g.clearRect(0,0,48,48);
  P(7,26,34,19,'#0a0604');P(8,27,32,17,'#e2b24c');P(10,29,28,13,'#2a1c10');P(11,30,26,11,'#4a3420');P(9,27,30,1,'#fff3b8');
  /* the arrow: an arc over the phone from its left to its right, two pixels thick and outlined, and a head that points down along it */
  const cx=24,cy=24,rx=15,ry=12,a0=Math.PI+.25,a1=2*Math.PI-.5,pt=a=>[cx+rx*Math.cos(a),cy+ry*Math.sin(a)],arc=[];
  for(let i=0;i<=60;i++){const[x,y]=pt(a0+(a1-a0)*i/60);arc.push([Math.round(x),Math.round(y)])}
  for(const[x,y]of arc)P(x-1,y-1,4,4,'#0a0604');
  const[ex,ey]=pt(a1),dx=-rx*Math.sin(a1),dy=ry*Math.cos(a1),dl=Math.hypot(dx,dy),ux=dx/dl,uy=dy/dl,tip=[ex+ux*6,ey+uy*6],b1=[ex-uy*4,ey+ux*4],b2=[ex+uy*4,ey-ux*4],
    side=(p,q,r)=>(q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0]),inTri=(x,y)=>{const p=[x+.5,y+.5],s1=side(b1,b2,p),s2=side(b2,tip,p),s3=side(tip,b1,p);return(s1>=0&&s2>=0&&s3>=0)||(s1<=0&&s2<=0&&s3<=0)};
  for(let y=0;y<48;y++)for(let x=0;x<48;x++)if(inTri(x,y)||inTri(x-1,y)||inTri(x+1,y)||inTri(x,y-1)||inTri(x,y+1))P(x,y,1,1,'#0a0604');
  for(const[x,y]of arc)P(x,y,2,2,'#e2b24c');
  for(let y=0;y<48;y++)for(let x=0;x<48;x++)if(inTri(x,y))P(x,y,1,1,'#e2b24c')}
const syncFull=()=>{const w=$('#wrap').classList;w.toggle('full',ov.classList.contains('on')||cb.classList.contains('on')||mn.classList.contains('on'));w.toggle('title',ov.classList.contains('title'))};
for(const el of[ov,cb,mn])new MutationObserver(syncFull).observe(el,{attributes:true,attributeFilter:['class']});
/* the engine's English comes first: nothing is shown before it is there */
oneLang('en','main').then(()=>{loadOpts();fit();skin();rotateIcon();buildVerbs();requestAnimationFrame(render);title()});
/* An installable app that plays offline (shared/pwa.js, sw.js): only where the game is served over http(s), never from disk or in the playtest's pages. */
if(/^https?:$/.test(location.protocol)&&'serviceWorker' in navigator)need('logo').then(()=>need('pwa')).then(p=>p.install({CHAP,LANGS})).catch(e=>console.error(e));
</script>
