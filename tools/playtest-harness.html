 (async()=>{try{

      let diff=0,far=0;for(let k=0;k<A.length;k+=4)if(A[k]!==B[k]||A[k+1]!==B[k+1]||A[k+2]!==B[k+2]){diff++;const x=(k/4)%(VW*HR)/HR,y=Math.floor(k/4/(VW*HR))/HR;if(Math.hypot(x-sp.lamp[0],y-sp.lamp[1])>30)far++}
