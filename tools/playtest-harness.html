<!-- Test driver injected into a temporary copy of index.html by tools/playtest.mjs. It plays the game through the real UI. -->
<pre id="tlog" style="position:fixed;left:0;top:0;margin:0;font:11px monospace;color:#0f0;background:rgba(0,0,0,.75);max-width:100%;white-space:pre-wrap;z-index:9"></pre>
<script>
(()=>{const stop=(location.href.match(/stop=(\w+)/)||[])[1]||'final';const L=m=>{$('#tlog').textContent+=m+'\n'};
 let sk=setInterval(()=>{if(G.skip)G.skip()},30);

 const idle=async()=>{await wait(120);let n=0;while((G.busy||P.walk||PC().walk)&&n++<4000){if($('#choices').classList.contains('on')||ov.classList.contains('end'))break;await wait(50)}};

 const item=id=>{const i=G.inv.indexOf(id);if(i<0)throw new Error('no item '+id);document.querySelectorAll('#inv .slot')[i].click()};

 const move=(x,y)=>at('mousemove',x,y),rclick=(x,y)=>at('contextmenu',x,y),dbl=(x,y)=>at('dblclick',x,y);

 const H=n=>ROOMS[G.room].hs.find(h=>h.name===n&&(!h.vis||h.vis()));

 /* the game is checked in English and in each other language: expected lines are written in English and translated with T, as the game does */
 const line=(v,name)=>T('{verb} {thing}',{verb:T(VNAME[v]),thing:T(name)});
 /* layout: no text may overflow its box in any language. Speech must stay inside the view; choices, the status line, the verbs and the top bar must fit. */
 /* one line of text must fit its width; a verb button may wrap, so it must also fit its height */
 const tight=new Set(),fits=(el,what,tall)=>{if(el&&(el.scrollWidth>el.clientWidth+1||tall&&el.scrollHeight>el.clientHeight+1))tight.add(what+": "+el.textContent)};
 new MutationObserver(()=>{const v=vp.getBoundingClientRect();for(const el of document.querySelectorAll("#speech .line")){const r=el.getBoundingClientRect();
   if(r.top<v.top-1||r.bottom>v.bottom+1||r.left<v.left-1||r.right>v.right+1)tight.add("speech: "+el.textContent)}}).observe($("#speech"),{childList:true});
 new MutationObserver(()=>{for(const b of document.querySelectorAll("#choices button"))fits(b,"choice")}).observe($("#choices"),{attributes:true,childList:true});
 new MutationObserver(()=>fits($("#status"),"status")).observe($("#status"),{childList:true,characterData:true,subtree:true});
 new MutationObserver(()=>fits($("#top"),"top bar")).observe($("#top"),{childList:true,characterData:true,subtree:true});
 /* mapClear: no name or line of text on the map that is showing crosses a coast, an island, a lake or a route (CONTRIBUTING section 3) */
 const mapClear=()=>{const M=SHARED.map,bx=M.state.boxes,bad=mapClear.bad=new Set(),hit=(b,[x0,y0],[x1,y1])=>{if(Math.max(x0,x1)<b[0]||Math.min(x0,x1)>b[2]||Math.max(y0,y1)<b[1]||Math.min(y0,y1)>b[3])return false;
     for(let k=0;k<=20;k++){const x=x0+(x1-x0)*k/20,y=y0+(y1-y0)*k/20;if(x>=b[0]&&x<=b[2]&&y>=b[1]&&y<=b[3])return true}return false};
   for(const b of bx){M.lines().forEach((p,j)=>{for(let i=2;i<p.length;i+=2)if(hit(b,[p[i-2],p[i-1]],[p[i],p[i+1]]))bad.add(b[4]+(j?' (island or lake)':' (coast)'))});
     for(const L of M.state.legs)for(const[x,y]of L.dots)if(x>=b[0]-.6&&x<=b[2]+.6&&y>=b[1]-.6&&y<=b[3]+.6)bad.add(b[4]+' (route)')}
   return bx.length>0&&!bad.size};
 const fitVerbs=()=>{for(const b of document.querySelectorAll("#verbs button"))if(getComputedStyle(b).display!=="none")fits(b,"verb",1)};

 const ok=(c,m)=>L((c?'ok   ':'FAIL ')+m);

  while(!G.ready)await wait(30);

    ok(ov.textContent.includes('PAUL OF TARSUS')&&store('paul.lang')==='en'&&$('#verbs button').textContent==='Look at','and back to English')}

    const c=makeCode();for(const k in F)delete F[k];G.room=null;
    ok($('#code').textContent===T('ENTER CODE'),'title shows ENTER CODE');$('#code').click();
    ok(cb.classList.contains('on')&&!$('#codebox .big'),'title: entry-only screen');
    $('#codein').value=c;$('#codego').click();await idle();
    ok(G.room==='street'&&!G.scene&&!ov.classList.contains('on')&&!G.busy&&has('longrope')&&has('patch')&&has('basket')&&!has('pouch'),'code from title starts mid-game: '+c);
    await act(null,"Eliab's door");ok(G.room==='workshop','playable after title code');halt('titlecode')}
  if(!C3&&!C4&&!HUB){
  ov.click();await idle();ok(G.room==='workshop'&&!G.busy,'intro ends in workshop');
  ok(!SHARED.map&&!SHARED.tablets,'the map and the tablets are not loaded until they are needed');
  if(lang==='de'){move(...hs('spool of thread'));ok($('#status').textContent==='Nimm Garnspule','German status line: Nimm Garnspule');
    verb('use');item('pouch');move(...hs('stool'));ok($('#status').textContent==='Benutze Werkzeugbeutel mit Hocker','German status line: Benutze Werkzeugbeutel mit Hocker');
    verb('use');move(ACT.eliab.x,ACT.eliab.y-18);ok($('#status').textContent==='Rede mit Eliab'&&!G.item,'German status line: Rede mit Eliab');G.hover=null;status()}

  halt('silent',()=>{AU.apple='iPad';$('#mute').click();$('#mute').click()});

  move(ACT.eliab.x,ACT.eliab.y-18);ok(lit()==='talk'&&$('#status').textContent===line('talk','Eliab'),'hover lights Talk to');
  halt('defverb');
  move(...hs('door to the street'));ok(lit()==='open'&&$('#status').textContent===line('open','door to the street'),'hover lights Open on a door');
  verb('look');move(...hs('spool of thread'));ok(lit()===''&&$('#status').textContent===line('look','spool of thread'),'no default lit while a verb is chosen');verb('look');
  move(...hs('stool'));ok(lit()==='look','hover lights Look at');
  heard.length=0;let px=P.x;ok(rclick(...hs('stool')),'right-click: no browser menu');await idle();ok(heard.includes(T(H('stool').look))&&P.x===px,'right-click looks without walking');
  heard.length=0;ok(rclickEl(document.querySelectorAll('#inv .slot')[0]),'inventory right-click: no browser menu');await idle();ok(heard.includes(T(ITEMS.pouch.look)),'right-click looks at an item');
  ok(rclickEl($('#status'))&&rclickEl($('#overlay')),'no browser menu anywhere in the game');

  place(P,'workshop',290,124,-1);G.cam=ART.workshop.w-320;G.speedAll=25;view(...hs('door to the street'));await wait(60);view(...hs('door to the street'));dbl(...hs('door to the street'));
  let t0=performance.now();await idle();ok(G.room==='street'&&performance.now()-t0<2500,'double-click on an exit skips the walk');G.speedAll=500;
  await act(null,"Eliab's door");ok(G.room==='workshop','back in the workshop');
  key('Tab');await wait(250);const want=ROOMS.workshop.hs.filter(h=>(!h.vis||h.vis())&&h.x+h.w>G.cam+4&&h.x<G.cam+316).length+1,tg=[...document.querySelectorAll('#tags .tag')];
  ok($('#tags').classList.contains('on')&&tg.length===want&&tg.some(t=>t.textContent===T('Eliab'))&&tg.every(t=>t.textContent.length>2),'Tab labels every hotspot ('+tg.length+')');
  halt('tags');
  key('Tab','keyup');await wait(150);ok(!$('#tags').classList.contains('on')&&!document.querySelector('#tags .tag'),'labels go when Tab is let go');

  document.querySelectorAll('#inv .slot')[G.inv.indexOf('tablets')].dispatchEvent(new MouseEvent('mouseenter'));ok(lit()==='open'&&$('#status').textContent===line('open','wax tablets'),'hovering the tablets lights Open');
  let tw=await tabs();ok(tw.classList.contains('on')&&leaf(0,T('Eliab')).length===1&&leaf(0,T('Untie my tool pouch.')).length===1&&leaf(0,T('Make the basket strong enough to carry a man.')).length===1&&leaf(1).length===4,
    'a click opens the tablets: people, open tasks and four passages');
  ok(leaf(1).every(t=>/\((?:[1-5]\.? )?\p{Lu}\p{Ll}+ \d+:\d+/u.test(t)),'every passage carries its reference');
  tw.click();await idle();ok(!tw.classList.contains('on')&&!G.busy,'a click closes them');
  await act('pickup','large basket');await use('pouch','basket');ok(has('basket')&&has('pouch'),'nonsense combination refused');
  verb('open');item('pouch');await idle();ok(has('awl')&&!has('pouch'),'pouch opens to awl');

  ok(decode('AAAAAA')===null&&decode('')===null&&decode(c1.slice(0,6)+(c1[6]==='A'?'B':'A'))===null,'bad codes rejected');
  ok(decode(c1.toLowerCase().replace('-',' ')).b===b1,'lower case and spaces accepted');

  await actor(null,ACT.eliab);ok(nq()===5,'once-question gone');heard.length=0;await pickQ('basket loops are frayed');
  ok(heard.includes(T(ACT.eliab.hs.ask.basket))&&nq()===4&&!F.strong,'learned topic answered once, and solves nothing');
  halt('choices');await choose(-1);
  heard.length=0;await give('knife',ACT.eliab);ok(heard.includes(T(ACT.eliab.hs.show.knife))&&has('knife'),'knife shown to Eliab: his own reply, item kept');
  heard.length=0;verb('use');item('longrope');view(ACT.eliab.x,ACT.eliab.y-18);await idle();ok(heard.includes(T(ACT.eliab.hs.show.longrope))&&has('longrope'),'using an item on a person shows it');
  ok(!/needed/.test(act.toString()),'the stock "not needed" line is gone');
  await sweep(ACT.eliab);
  halt('pray',()=>{pray()});
  pray();await idle();ok(G.prays===1&&!G.busy,'prayer returns control, hint='+hint()[0]);
  await act(null,'door to the street');ok(G.room==='street','in street');
  await act(null,'alley to the wall quarter');ok(G.room==='street'&&P.x<400,'guard turns Paul back');
  halt('guard',()=>{ACT.guard.dir=1;say(ACT.guard,'Halt! The wall quarter is closed tonight. Orders of the governor.')});
  await actor(null,ACT.zakkai);ok(F.metZakkai&&nq()===5&&hasQ('soldier in the street is thirsty'),'met merchant; he mentions the thirsty soldier');
  heard.length=0;await pickQ('soldier in the street is thirsty');ok(heard.includes(T(ACT.zakkai.hs.ask.thirst)),'thirst topic answered');
  await choose(0);await choose(1);await choose(-1);

  await sweep(ACT.guard,ACT.zakkai);

  await useOn('skin','well');ok(has('skinfull'),'waterskin filled');
  await actor(null,ACT.guard);if($('#choices').classList.contains('on'))await choose(-1);verb('give');item('skinfull');view(ACT.guard.x,ACT.guard.y-18);await idle();ok(F.kind&&has('skin'),'water given to guard');
  await useOn('awl','torn awning');ok(F.awning&&has('straps')&&!has('patch'),'awning mended, straps received');
