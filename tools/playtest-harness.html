<!-- Test driver injected into a temporary copy of index.html by tools/playtest.mjs. It plays the game through the real UI. -->
<pre id="tlog" style="position:fixed;left:0;top:0;margin:0;font:11px monospace;color:#0f0;background:rgba(0,0,0,.75);max-width:100%;white-space:pre-wrap;z-index:9"></pre>
<script>
(()=>{const stop=(location.href.match(/stop=(\w+)/)||[])[1]||'final';const L=m=>{$('#tlog').textContent+=m+'\n'};
 let sk=setInterval(()=>{if(G.skip)G.skip()},30);

 const idle=async()=>{await wait(120);let n=0;while((G.busy||P.walk||PC().walk)&&n++<4000){if($('#choices').classList.contains('on')||ov.classList.contains('end'))break;await wait(50)}};
 const verb=v=>document.querySelector(`#verbs button[data-v=${v}]`).click();
 const view=(x,y)=>{const r=vp.getBoundingClientRect();vp.dispatchEvent(new MouseEvent('click',{clientX:r.left+(x-G.cam)/320*r.width,clientY:r.top+y/144*r.height,bubbles:true}))};
 const item=id=>{const i=G.inv.indexOf(id);if(i<0)throw new Error('no item '+id);document.querySelectorAll('#inv .slot')[i].click()};
 const hs=name=>{const h=ROOMS[G.room].hs.find(h=>h.name===name&&(!h.vis||h.vis()));if(!h)throw new Error('no hs '+name+' in '+G.room);return[h.x+h.w/2,h.y+h.h/2]};
 const act=async(v,name)=>{if(v)verb(v);view(...hs(name));await idle()};
 const use=async(a,b)=>{verb('use');item(a);item(b);await idle()};
 const useOn=async(a,name,v)=>{verb(v||'use');item(a);view(...hs(name));await idle()};
 const actor=async(v,a)=>{if(v)verb(v);view(a.x,a.y-18);await idle()};
 const at=(type,x,y)=>{const r=vp.getBoundingClientRect(),e=new MouseEvent(type,{clientX:r.left+(x-G.cam)/320*r.width,clientY:r.top+y/144*r.height,bubbles:true,cancelable:true});vp.dispatchEvent(e);return e.defaultPrevented};
 const move=(x,y)=>at('mousemove',x,y),rclick=(x,y)=>at('contextmenu',x,y),dbl=(x,y)=>at('dblclick',x,y);
 const rclickEl=el=>{const e=new MouseEvent('contextmenu',{bubbles:true,cancelable:true});el.dispatchEvent(e);return e.defaultPrevented};
 const key=(k,type)=>dispatchEvent(new KeyboardEvent(type||'keydown',{key:k,bubbles:true,cancelable:true}));
 const lit=()=>[...document.querySelectorAll('#verbs button.def')].map(b=>b.dataset.v).join();
 const H=n=>ROOMS[G.room].hs.find(h=>h.name===n&&(!h.vis||h.vis()));
 const PASS2=k=>{const p=CHAP[2].tablets.scripture.find(s=>s.ref===({ps16:'Psalm 16:10'})[k]);return T('"{text}" ({ref})',{text:T(p.text),ref:T(p.ref)})};
 /* the game is checked in English and in each other language: expected lines are written in English and translated with T, as the game does */
 const line=(v,name)=>T('{verb} {thing}',{verb:T(VNAME[v]),thing:T(name)});
 /* layout: no text may overflow its box in any language. Speech must stay inside the view; choices, the status line, the verbs and the top bar must fit. */
 /* one line of text must fit its width; a verb button may wrap, so it must also fit its height */
 const tight=new Set(),fits=(el,what,tall)=>{if(el&&(el.scrollWidth>el.clientWidth+1||tall&&el.scrollHeight>el.clientHeight+1))tight.add(what+": "+el.textContent)};
 new MutationObserver(()=>{const v=vp.getBoundingClientRect();for(const el of document.querySelectorAll("#speech .line")){const r=el.getBoundingClientRect();
   if(r.top<v.top-1||r.bottom>v.bottom+1||r.left<v.left-1||r.right>v.right+1)tight.add("speech: "+el.textContent)}}).observe($("#speech"),{childList:true});
 new MutationObserver(()=>{for(const b of document.querySelectorAll("#choices button"))fits(b,"choice")}).observe($("#choices"),{attributes:true,childList:true});
 new MutationObserver(()=>fits($("#status"),"status")).observe($("#status"),{childList:true,characterData:true,subtree:true});
 new MutationObserver(()=>fits($("#top"),"top bar")).observe($("#top"),{childList:true,characterData:true,subtree:true});
 const fitVerbs=()=>{for(const b of document.querySelectorAll("#verbs button"))if(getComputedStyle(b).display!=="none")fits(b,"verb",1)};
 const heard=[];new MutationObserver(m=>m.forEach(r=>r.addedNodes.forEach(n=>heard.push(n.textContent)))).observe($('#speech'),{childList:true});
 const choose=async i=>{const b=document.querySelectorAll('#choices button');b[i<0?b.length+i:i].click();await idle()};
 const ok=(c,m)=>L((c?'ok   ':'FAIL ')+m);
 const halt=(name,fn)=>{if(stop===name){clearInterval(sk);L('STOP '+name+' room='+G.room+' inv='+G.inv.join(','));if(fn)fn();throw 'halt'}};
 addEventListener('error',e=>L('JSERR '+e.message));addEventListener('unhandledrejection',e=>{if(e.reason!=='halt')L('REJ '+(e.reason&&e.reason.message||e.reason))});
 (async()=>{try{
  while(!G.ready)await wait(30);
  const srt=()=>G.inv.slice().sort().join(),nq=()=>document.querySelectorAll('#choices button').length;
  /* a choice is found by its English text (the button keeps it), or, for a line the level puts together, by the translation of a part of it */
  const isQ=(b,t)=>(b.dataset.src||'').includes(t)||b.textContent.includes(T.peek(t)||t);
  const pickQ=async txt=>{const b=[...document.querySelectorAll('#choices button')],i=b.findIndex(x=>isQ(x,txt));if(i<0)throw new Error('no choice '+txt);b[i].click();await idle()};
  const hasQ=t=>[...document.querySelectorAll('#choices button')].some(b=>isQ(b,t));
  /* show sweep: every carried item shown to each person gets an answer in his own voice, and nothing in the game changes */
  const sweep=async(...as)=>{const f=JSON.stringify(F),inv=srt(),bad=[];let n=0,own=0;
    for(const a of as)for(const id of G.inv.slice()){heard.length=0;await cut(()=>show(a.hs,id));n++;if(a.hs.show&&a.hs.show[id]!=null)own++;
      if(!heard.length||heard.includes(T('Keep it, friend.')))bad.push(a.id+'/'+id)}
    ok(!bad.length&&JSON.stringify(F)===f&&srt()===inv,`show: ${n} item-person pairs answered, ${own} with their own line (${as.map(a=>a.id)})`+(bad.length?' MISSING '+bad:''))};
  /* the tablets stay open (and the game busy) until closed, so wait for the overlay rather than for idle */
  const tabs=async()=>{item('tablets');for(let i=0;i<150&&!document.querySelector('#tablets.on');i++)await wait(30);return $('#tablets')};
  const leaf=(i,t)=>[...$('#tablets').querySelectorAll('.leaf')[i].querySelectorAll('p')].map(p=>p.textContent).filter(x=>!t||x.includes(t));
  const enter=async c=>{$('#code').click();$('#codein').value=c;$('#codego').click();await idle()};
  const give=async(id,a)=>{verb('give');item(id);view(a.x,a.y-18);await idle()};
  /* Chapter Three stops start that chapter from the title screen, without replaying the first two. */
  const C3=/^(tarsus|barnabas|tent|frame|meeting|court|antioch|potter|jar|quiz3|sealed|loaded|road|final3|map3|hubmap)$/.test(stop);let n=0;
  const lang=(location.search.match(/[?&]lang=(\w+)/)||[])[1]||'en',toLang=async l=>{for(let i=0;i<150&&G.lang!==l;i++)await wait(30);await wait(60)};
  ok(G.lang===lang&&document.documentElement.lang===lang,'the game is in '+LANGS[lang].native+', as the address asks');fitVerbs();
  if(lang==='de')ok([...document.querySelectorAll('#verbs button')].slice(0,7).map(b=>b.textContent).join()==='Betrachte,Nimm,Benutze,Öffne,Rede mit,Gib,Zu Jehova beten'
    &&ov.textContent.includes('PAULUS VON TARSUS')&&$('#code').textContent==='CODE EINGEBEN'&&$('#mute').textContent.includes('TON AN')&&document.title.startsWith('Paulus'),'German on the title screen, in the panel and in the top bar');
  halt('title');
  /* sound: the first press anywhere starts it; a press wakes sound that iOS interrupted; on iPhone and iPad a note says where Silent Mode is */
  {const hushOn=()=>$('#hush').classList.contains('on'),dev=AU.apple;
    ok(!dev,'desktop Chrome is not taken for an iPhone or iPad');ok(!AU.ctx,'no sound before the first press');
    AU.apple='iPad';dispatchEvent(new PointerEvent('pointerdown',{bubbles:true}));
    ok(AU.ctx&&hushOn()&&$('#hush').textContent.includes(T('No music? This iPad may be in Silent Mode.')),'the first press starts the sound; on an iPad it mentions Silent Mode');
    dispatchEvent(new PointerEvent('pointerup',{bubbles:true}));ok(hushOn(),'the note outlasts the press that opened it');
    await wait(450);dispatchEvent(new PointerEvent('pointerdown',{bubbles:true}));ok(!hushOn(),'the next press puts the note away');
    $('#mute').click();ok(AU.muted&&!hushOn(),'sound off: no note');$('#mute').click();ok(!AU.muted&&hushOn(),'sound on again: the note comes back');
    await wait(450);key('Shift');ok(!hushOn(),'a key puts the note away');
    AU.apple=dev;$('#mute').click();$('#mute').click();ok(!AU.muted&&!hushOn(),'no note on a desktop');
    const real=AU.ctx;let n=0;const fake=st=>({state:st,resume(){n++;return Promise.resolve()},createBuffer(){return{}},createBufferSource(){return{connect(){},start(){}}},destination:{}});
    AU.ctx=fake('interrupted');dispatchEvent(new PointerEvent('pointerup',{bubbles:true}));ok(n===1,'a tap wakes sound that iOS interrupted');
    AU.ctx=fake('suspended');key('Shift');ok(n===2,'a key wakes sound the browser held back');
    AU.ctx=fake('running');dispatchEvent(new MouseEvent('click'));ok(n===2,'running sound is left alone');AU.ctx=real}
  /* the language picker on the title screen: it switches the text, remembers the choice, and starts nothing */
  if(lang==='en'){document.querySelector('#overlay [data-lang="de"]').click();await toLang('de');
    ok(ov.textContent.includes('PAULUS VON TARSUS')&&ov.textContent.includes('Ruf nach Antiochia')&&store('paul.lang')==='de'&&!G.room&&ov.classList.contains('on'),'the title screen switches to German, remembers it, and starts nothing');
    fitVerbs();document.querySelector('#overlay [data-lang="en"]').click();await toLang('en');
    ok(ov.textContent.includes('PAUL OF TARSUS')&&store('paul.lang')==='en'&&$('#verbs button').textContent==='Look at','and back to English')}
  if(stop==='title2'){document.querySelector('#overlay [data-ch="2"]').click();await idle();ok(G.ch===2&&G.room==='jerusalem'&&!G.busy,'title starts chapter two');halt('title2')}
  if(stop==='title3'){document.querySelector('#overlay [data-ch="3"]').click();await idle();ok(G.ch===3&&G.room==='tarsus'&&!G.busy&&ACT.barnabas.x>100,'title starts chapter three');halt('title3')}
  if(stop==='titlecode'){Object.assign(F,{gotAwl:1,gotThread:1,gotKnife:1,gotCloth:1,gotRope:1,gotSkin:1,gotBasket:1,cutCloth:1,longRope:1});G.room='street';
    const c=makeCode();for(const k in F)delete F[k];G.room=null;
    ok($('#code').textContent===T('ENTER CODE'),'title shows ENTER CODE');$('#code').click();
    ok(cb.classList.contains('on')&&!$('#codebox .big'),'title: entry-only screen');
    $('#codein').value=c;$('#codego').click();await idle();
    ok(G.room==='street'&&!G.scene&&!ov.classList.contains('on')&&!G.busy&&has('longrope')&&has('patch')&&has('basket')&&!has('pouch'),'code from title starts mid-game: '+c);
    await act(null,"Eliab's door");ok(G.room==='workshop','playable after title code');halt('titlecode')}
  if(!C3){
  ov.click();await idle();ok(G.room==='workshop'&&!G.busy,'intro ends in workshop');
  ok(!SHARED.map&&!SHARED.tablets,'the map and the tablets are not loaded until they are needed');
  if(lang==='de'){move(...hs('spool of thread'));ok($('#status').textContent==='Nimm Garnspule','German status line: Nimm Garnspule');
    verb('use');item('pouch');move(...hs('stool'));ok($('#status').textContent==='Benutze Werkzeugbeutel mit Hocker','German status line: Benutze Werkzeugbeutel mit Hocker');
    verb('use');move(ACT.eliab.x,ACT.eliab.y-18);ok($('#status').textContent==='Rede mit Eliab'&&!G.item,'German status line: Rede mit Eliab');G.hover=null;status()}
  halt('workshop',()=>{say(ACT.eliab,'Tonight we lower you from her window. We need a basket that will hold, and a rope that will reach.')});
  halt('silent',()=>{AU.apple='iPad';$('#mute').click();$('#mute').click()});
  halt('walk',()=>{P.speed=4;walk(P,60,130)});
  /* the verb interface: default verbs, lit verb, right-click, double-click, Tab labels, keys */
  ok(defVerb(H('door to the street'))==='open'&&defVerb(ACT.eliab.hs)==='talk'&&defVerb(H('spool of thread'))==='pickup'&&defVerb(H('shelf'))==='look'
    &&defVerb(H('large basket'))==='pickup','default verbs inferred');
  move(...hs('spool of thread'));ok(lit()==='pickup'&&$('#status').textContent===line('pickup','spool of thread')&&!document.querySelector('#verbs button.sel'),'hover lights Pick up');
  move(ACT.eliab.x,ACT.eliab.y-18);ok(lit()==='talk'&&$('#status').textContent===line('talk','Eliab'),'hover lights Talk to');
  halt('defverb');
  move(...hs('door to the street'));ok(lit()==='open'&&$('#status').textContent===line('open','door to the street'),'hover lights Open on a door');
  verb('look');move(...hs('spool of thread'));ok(lit()===''&&$('#status').textContent===line('look','spool of thread'),'no default lit while a verb is chosen');verb('look');
  move(...hs('stool'));ok(lit()==='look','hover lights Look at');
  heard.length=0;let px=P.x;ok(rclick(...hs('stool')),'right-click: no browser menu');await idle();ok(heard.includes(T(H('stool').look))&&P.x===px,'right-click looks without walking');
  heard.length=0;ok(rclickEl(document.querySelectorAll('#inv .slot')[0]),'inventory right-click: no browser menu');await idle();ok(heard.includes(T(ITEMS.pouch.look)),'right-click looks at an item');
  ok(rclickEl($('#status'))&&rclickEl($('#overlay')),'no browser menu anywhere in the game');
  await act(null,'spool of thread');ok(has('thread')&&F.gotThread,'plain click on an item picks it up');
  place(P,'workshop',290,124,-1);G.cam=ART.workshop.w-320;G.speedAll=25;view(...hs('door to the street'));await wait(60);view(...hs('door to the street'));dbl(...hs('door to the street'));
  let t0=performance.now();await idle();ok(G.room==='street'&&performance.now()-t0<2500,'double-click on an exit skips the walk');G.speedAll=500;
  await act(null,"Eliab's door");ok(G.room==='workshop','back in the workshop');
  key('Tab');await wait(250);const want=ROOMS.workshop.hs.filter(h=>(!h.vis||h.vis())&&h.x+h.w>G.cam+4&&h.x<G.cam+316).length+1,tg=[...document.querySelectorAll('#tags .tag')];
  ok($('#tags').classList.contains('on')&&tg.length===want&&tg.some(t=>t.textContent===T('Eliab'))&&tg.every(t=>t.textContent.length>2),'Tab labels every hotspot ('+tg.length+')');
  halt('tags');
  key('Tab','keyup');await wait(150);ok(!$('#tags').classList.contains('on')&&!document.querySelector('#tags .tag'),'labels go when Tab is let go');
  key('1');ok(G.verb==='look','key 1 picks Look at');key('1');ok(G.verb==='walk','key 1 again puts it down');
  key('m');ok(AU.muted,'M mutes');key('m');ok(!AU.muted,'M unmutes');
  document.querySelectorAll('#inv .slot')[G.inv.indexOf('tablets')].dispatchEvent(new MouseEvent('mouseenter'));ok(lit()==='open'&&$('#status').textContent===line('open','wax tablets'),'hovering the tablets lights Open');
  let tw=await tabs();ok(tw.classList.contains('on')&&leaf(0,T('Eliab')).length===1&&leaf(0,T('Untie my tool pouch.')).length===1&&leaf(0,T('Make the basket strong enough to carry a man.')).length===1&&leaf(1).length===4,
    'a click opens the tablets: people, open tasks and four passages');
  ok(leaf(1).every(t=>/\((?:[1-5]\.? )?\p{Lu}\p{Ll}+ \d+:\d+/u.test(t)),'every passage carries its reference');
  tw.click();await idle();ok(!tw.classList.contains('on')&&!G.busy,'a click closes them');
  await act('pickup','large basket');await use('pouch','basket');ok(has('basket')&&has('pouch'),'nonsense combination refused');
  verb('open');item('pouch');await idle();ok(has('awl')&&!has('pouch'),'pouch opens to awl');
  for(const n of["tentmaker's knife",'bolt of goat-hair cloth','coil of rope','waterskin'])await act('pickup',n);
  ok(['thread','knife','cloth','rope','skin','basket'].every(has),'workshop items collected');
  await use('thread','basket');ok(has('basket')&&!F.strong,'no reinforcing without straps');
  await use('knife','cloth');ok(has('patch')&&has('strips')&&!has('cloth'),'cloth cut');
  await use('strips','rope');ok(has('longrope')&&!has('rope'),'rope lengthened');
  const c1=makeCode(),b1=stateBits(),inv1=srt();
  ok(decode(c1).b===b1&&decode(c1).ch===1&&/^[0-9A-Z]{3}-[0-9A-Z]{3}$/.test(c1)&&$('#code').textContent===T('CODE {code}',{code:c1}),'code round-trips: '+c1);
  ok(decode('AAAAAA')===null&&decode('')===null&&decode(c1.slice(0,6)+(c1[6]==='A'?'B':'A'))===null,'bad codes rejected');
  ok(decode(c1.toLowerCase().replace('-',' ')).b===b1,'lower case and spaces accepted');
  await actor(null,ACT.eliab);ok(nq()===6&&hasQ('basket loops are frayed'),'eliab has 5 questions, and one about the frayed basket');await choose(3);await choose(-1);
  await actor(null,ACT.eliab);ok(nq()===5,'once-question gone');heard.length=0;await pickQ('basket loops are frayed');
  ok(heard.includes(T(ACT.eliab.hs.ask.basket))&&nq()===4&&!F.strong,'learned topic answered once, and solves nothing');
  halt('choices');await choose(-1);
  heard.length=0;await give('knife',ACT.eliab);ok(heard.includes(T(ACT.eliab.hs.show.knife))&&has('knife'),'knife shown to Eliab: his own reply, item kept');
  heard.length=0;verb('use');item('longrope');view(ACT.eliab.x,ACT.eliab.y-18);await idle();ok(heard.includes(T(ACT.eliab.hs.show.longrope))&&has('longrope'),'using an item on a person shows it');
  ok(!/needed/.test(act.toString()),'the stock "not needed" line is gone');
  await sweep(ACT.eliab);
  halt('pray',()=>{pray()});
  pray();await idle();ok(G.prays===1&&!G.busy,'prayer returns control, hint='+hint()[0]);
  await act(null,'door to the street');ok(G.room==='street','in street');
  await act(null,'alley to the wall quarter');ok(G.room==='street'&&P.x<400,'guard turns Paul back');
  halt('guard',()=>{ACT.guard.dir=1;say(ACT.guard,'Halt! The wall quarter is closed tonight. Orders of the governor.')});
  await actor(null,ACT.zakkai);ok(F.metZakkai&&nq()===5&&hasQ('soldier in the street is thirsty'),'met merchant; he mentions the thirsty soldier');
  heard.length=0;await pickQ('soldier in the street is thirsty');ok(heard.includes(T(ACT.zakkai.hs.ask.thirst)),'thirst topic answered');
  await choose(0);await choose(1);await choose(-1);
  await actor(null,ACT.guard);ok(nq()===2&&hasQ("merchant's awning"),'the guard can be asked about the awning');await choose(-1);
  await sweep(ACT.guard,ACT.zakkai);
  halt('show',()=>{P.dir=1;say(ACT.guard,ACT.guard.hs.show.longrope)});
  await useOn('skin','well');ok(has('skinfull'),'waterskin filled');
  await actor(null,ACT.guard);if($('#choices').classList.contains('on'))await choose(-1);verb('give');item('skinfull');view(ACT.guard.x,ACT.guard.y-18);await idle();ok(F.kind&&has('skin'),'water given to guard');
  await useOn('awl','torn awning');ok(F.awning&&has('straps')&&!has('patch'),'awning mended, straps received');
  await use('straps','basket');ok(has('strongbasket'),'basket reinforced');
  const c2=makeCode(),inv2=srt();
  $('#code').click();ok(cb.classList.contains('on')&&$('#codebox .big').textContent===c2,'safe point screen shows '+c2);
  halt('code');
  $('#codein').value='ZZZ-ZZ2';$('#codego').click();ok(cb.classList.contains('on')&&G.room==='street','invalid code refused');
  $('#codein').value=c1;$('#codego').click();await idle();
  ok(G.room==='workshop'&&srt()===inv1&&!G.busy&&!F.awning&&!cb.classList.contains('on'),'code restores workshop state');
  $('#code').click();$('#codein').value=c2;$('#codego').click();await idle();
  ok(G.room==='street'&&srt()===inv2&&F.awning&&F.kind&&!F.water,'code restores street state');
  /* the language can change at any moment: only the text changes, and a code is the same in every language */
  if(lang==='en'){const c=makeCode(),f=JSON.stringify(F),inv=srt();$('#lang').click();await toLang('de');
    ok(makeCode()===c&&JSON.stringify(F)===f&&srt()===inv&&$('#verbs button').textContent==='Betrachte'&&$('#code').textContent==='CODE '+c&&$('#lang').textContent==='DE',
      'the top-bar button switches to German mid-game: the same state, the same code '+c);fitVerbs();
    await enter(c1);ok(G.room==='workshop'&&srt()===inv1&&!F.awning&&G.lang==='de','a code written down in English restores the same point in German');
    await enter(c);$('#lang').click();await toLang('en');ok(makeCode()===c&&$('#verbs button').textContent==='Look at'&&JSON.stringify(F)===f,'and back to English')}
  halt('street',()=>{place(P,'street',300,124,1)});

  await act('use','oil lamp');ok(F.lampOut,'lamp out');
