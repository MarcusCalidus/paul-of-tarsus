(()=>{const stop=(location.href.match(/stop=(\w+)/)||[])[1]||'final';const L=m=>{if(/^(STOP|DONE)/.test(m))routeCheck();$('#tlog').textContent+=m+'\n'};

 const placeBad=new Set();let probing=0;
 {const p0=place;window.place=function(a,room,x,y){const r=p0.apply(this,arguments);try{if(G.speedAll>200&&!probing&&a&&ROOMS[room]&&ROOMS[room].walk&&!planOf(room)){
   const inF=roomFeet(room).filter(f=>inBox(f.b,x,y,0));if(inF.length&&!inF.some(f=>f.seat))placeBad.add(`${G.ch} ${room}: ${a.id} put down at ${x|0},${y|0}`)}}catch(e){}return r}}
 const routeCheck=()=>{const b=[...ROUTE.bad,...placeBad];$('#tlog').textContent+=(b.length?'FAIL ':'ok   ')+'every walk in a room keeps clear of what stands on the floor, and nobody is put down in it'+(b.length?'. BAD: '+b.slice(0,10).join(' | '):'')+'\n'};

 const mapClear=()=>{const M=SHARED.map,bx=M.state.boxes,bad=mapClear.bad=new Set(),hit=(b,[x0,y0],[x1,y1])=>{if(Math.max(x0,x1)<b[0]||Math.min(x0,x1)>b[2]||Math.max(y0,y1)<b[1]||Math.min(y0,y1)>b[3])return false;
     for(let k=0;k<=20;k++){const x=x0+(x1-x0)*k/20,y=y0+(y1-y0)*k/20;if(x>=b[0]&&x<=b[2]&&y>=b[1]&&y<=b[3])return true}return false};

     for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const X=x+dx,Y=y+dy,j=Y*W+X;if(X>=0&&X<W&&Y>=0&&Y<Hh&&!seen[j]&&d[j*4+3]){seen[j]=1;st.push(j)}}}}return n};
 const snap=()=>JSON.stringify([F,G.invs,G.inv,G.room,G.ch]),prayBad=[];let prayed=null,prayers=0;
 {const p0=pray;window.pray=function(){prayed=snap();prayers++;return p0.apply(this,arguments)}}

 {const s0=say;window.say=function(a,text,o){const r=s0.apply(this,arguments);

 (async()=>{try{
  while(!G.ready)await wait(30);
  /* The game opens on its opening picture (shared/splash.js), on every visit: the name over a tentmaker's bench by lamplight, silent, with
     one line that asks for a click. That click starts the overture and nothing else; a second click, or the end of the melody, brings the

    {const b=ov.querySelector('.begin').getBoundingClientRect(),v=ov.getBoundingClientRect();if(b.left<v.left||b.right>v.right||b.bottom>v.bottom)tight.add('Click to begin')}
    /* the picture: painted down to the foot of the window, brightest round the lamp, dark behind the name, and it does not flicker as a whole */
    {const[a,ga]=mk(VW*HR,VT*HR),[b,gb]=mk(VW*HR,VT*HR);ga.scale(HR,HR);gb.scale(HR,HR);sp.scene(ga,0);sp.scene(gb,170);
      const A=ga.getImageData(0,0,VW*HR,VT*HR).data,B=gb.getImageData(0,0,VW*HR,VT*HR).data,lum=(x,y,w,h)=>{let s=0;for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++){const k=(j*HR*VW*HR+i*HR)*4;s+=A[k]+A[k+1]+A[k+2]}return s/(3*w*h)};
      let diff=0,far=0;for(let k=0;k<A.length;k+=4)if(A[k]!==B[k]||A[k+1]!==B[k+1]||A[k+2]!==B[k+2]){diff++;const x=(k/4)%(VW*HR)/HR,y=Math.floor(k/4/(VW*HR))/HR;if(Math.hypot(x-sp.lamp[0],y-sp.lamp[1])>30)far++}
      const lamp=lum(sp.lamp[0]-20|0,sp.lamp[1]+2|0,40,14),top=lum(60,6,200,40),foot=lum(0,VT-6,VW,6);
      ok(lamp>90&&top<60&&top>4&&foot>2&&lamp>top*2.5,'its picture is lit by the one lamp and dark behind the name (lamp '+Math.round(lamp)+', behind the name '+Math.round(top)+')');

    ok(loopOf(sp.score)===160&&Math.abs(sp.len-26.4)<.01&&sp.turn<sp.len&&sp.turn>sp.len-5&&sp.score.tracks.every(t=>t.drone||t.drum||typeof INST[t.inst]==='function')&&sp.score.tracks.some(t=>t.inst==='horn')
      &&sp.score.root===CHAP[1].music.root&&sp.score.scale.join()===CHAP[1].music.scale.join(),'the overture is ten bars in Chapter One\'s key, about 26 seconds, on voices the engine has, the horn among them');
    halt('splash',()=>{ov.querySelectorAll('.go').forEach(g=>g.style.animation='none')});
    /* that click is the press that wakes the sound. The sound itself is tested further down, from silence: here the call is only counted */
    const wake=audioInit;let woke=0;window.audioInit=()=>{woke++};
    ov.click();ok(woke>0&&G.splash===2&&AU.mood==='calm'&&TITLE.mood===CHAP[1].music.overture&&AU.score===sp.score&&sp.score.then===CHAP[1].music&&cls.contains('playing')&&cls.contains('splash')&&!G.room&&G.scene===sp.scene,'a click wakes the sound, starts the overture, and starts nothing else; the title\'s music will follow it quiet, without an overture of its own');
    await wait(560);ok(!seen(ov.querySelector('.begin'))&&!seen(ov.querySelector('.chs')),'"Click to begin" goes, and the name stays alone over the picture while the overture plays');
    /* the sequencer: a score that names another is played once, and that one follows it */
    {const st=AU.step;AU.step=loopOf(sp.score)-2;stepOn(sp.score);const mid=AU.score===sp.score&&AU.step===loopOf(sp.score)-1;stepOn(sp.score);

      const part=(n,k)=>by[n].filter(x=>x[0]===k).map(x=>Math.round(x[1])),one=['drone','harp','ney','chime'].map(k=>part(1,k).join()).join('|'),h7=part(7,'harp');
      ok(!mo.length&&k5===CHAP[5].music,`the map's sting and arrival chime sound in each of the ten chapters' keys, and Chapter Five, which opens on the map, has its own key before it starts`+(mo.length?' OUT '+mo:''));
      ok(one==='50|62,66,69,74|74,75,78,81,78|81,86'&&h7.some(m=>pc(m,CHAP[7].music)===7),`Chapter One's sting keeps its register (${one}), and in Chapter Seven's five notes its harp reaches the fifth (${h7})`)}
    finally{AU.key=k0}}
  /* high notes: bite is exactly 1 up to its knee and falls, never rising, above it; Chapter One's ney is quieter at the top of its hope tune
     and exactly as it was below the knee in the calm one */
  {let flat=true,down=true,prev=1;for(let f=20;f<=550;f+=5)if(bite(f)!==1)flat=false;for(let f=555;f<=8000;f+=5){const b=bite(f);if(!(b<1&&b<=prev))down=false;prev=b}
    const sc=CHAP[1].music,ny=sc.tracks.filter(tr=>tr.inst==='ney'),fs=tr=>[...new Set(tr.lines.flat().map(([,dg])=>mtof(note(dg,tr.oct,sc))))],
      hope=fs(ny.find(tr=>tr.moods.includes('hope'))),calm=fs(ny.find(tr=>tr.moods.includes('calm'))).filter(f=>f<=550),top=Math.max(...hope),
      lvl=f=>{const t0=window.tone,n0=window.noise,seen=[];window.tone=o=>seen.push(o.v);window.noise=o=>seen.push(o.v);try{INST.ney(f,0,.5,1)}finally{window.tone=t0;window.noise=n0}return seen};
    ok(flat&&down&&lvl(top).every((v,i)=>v<[.1,.08][i])&&calm.length&&calm.every(f=>lvl(f).join()==='0.1,0.08'),

  /* the held pipe: in each of the ten chapters' keys, an aulos track with hold:0 or hold:7 gets one held note per bar in which its melody
     plays, on the tonic or the fifth under it; a track without hold gets none; and Chapter Six's feast asks for the tonic, over its drone */
  {const a0=INST.aulos,sc0=AU.score,m0=AU.mood,hd=[],bad=[];let none=0;
    try{INST.aulos=()=>{};INST.aulos.hold=(f,t,d,v)=>hd.push(f);
      for(let n=1;n<=10;n++)for(const h of[0,7,null]){const k=CHAP[n].music,tr={inst:'aulos',oct:12,seq:{A:[0,null,2,null,4,null,2,null,0,null,2,null,4,null,2,null],B:Array(16).fill(null)},prog:'AB'};
        if(h!=null)tr.hold=h;hd.length=0;AU.score={dt:.16,root:k.root,scale:k.scale,tracks:[tr]};AU.mood='calm';for(let st=0;st<64;st++)playStep(st,1000+st*.16);
        if(h==null){none+=hd.length;continue}
        const pcs=hd.map(f=>((Math.round(69+12*Math.log2(f/440))-k.root)%12+12)%12);if(hd.length!==2||pcs.some(p=>p!==h))bad.push(n+'/'+h+':'+pcs)}}
    finally{INST.aulos=a0;AU.score=sc0;AU.mood=m0}
    const feast=CHAP[6].music.tracks.filter(tr=>tr.moods&&tr.moods.includes('feast'));
    ok(!bad.length&&!none&&feast.some(tr=>tr.inst==='aulos'&&tr.hold===0)&&feast.some(tr=>tr.drone&&tr.drone.join()==='0'&&tr.every===16&&tr.vol===.6),'the held pipe: on the tonic or the fifth in all ten keys, once a bar while the melody plays and not in a silent bar; none without hold; Chapter Six\'s feast holds the tonic over its drone'+(bad.length?' WRONG '+bad:''))}
  {const real=Object.values(CHAP).filter(c=>c.src);/* the chapters that are level files: not the hub test's own */
    ok(real.length>=9&&real.every(c=>c.ready)&&!taken.length,'ids: all '+real.length+' chapters are loaded, and none took a room, a backdrop or an item from another'+(taken.length?'. TAKEN: '+taken.join(' | '):''))}
  /* cast & contact shadows (issue #81): pitch-dark zero shadow, floor cast & wall bend, SPR cache cap and lane-map exclusion */
  {const[,gt]=mk(120,100);gt.scale(HR,HR);gt.translate(-110,-95);const sp=sprite('sh-end-paul',s=>person(s,0,0,paulLook(9),1,0,0,0,0,0),1);
    const q0=F.quake,l0=G.lit9;F.quake=0;G.lit9=0;figShadow(gt,'cell9',150,131,sp,8.5);
    const d0=gt.getImageData(0,0,120,100).data;let nz0=0;for(let i=3;i<d0.length;i+=4)if(d0[i])nz0++;
    F.quake=1;G.lit9=1;figShadow(gt,'cell9',150,131,sp,8.5);
    const d1=gt.getImageData(0,0,120,100).data;let nz1=0;for(let i=3;i<d1.length;i+=4)if(d1[i])nz1++;
    F.quake=q0;G.lit9=l0;
    ok(nz0===0&&nz1>50&&SPR.size<=500,`shadows: zero pixels in pitch-dark cell9 (${nz0}), ${nz1} shadow pixels when lit, SPR.size=${SPR.size}<=500`)}
  ok(prayers>0&&!prayBad.length,prayers+' prayers, and not one of them changed anything in the game'+(prayBad.length?'. CHANGED before: '+prayBad.slice(0,6).join(' | '):''));
  {const wrong=prayName.filter(([,w,nm])=>w!==nm);
   ok(prayName.length>0&&!wrong.length,prayName.length+' prayers of Paul name him as the narration does: Saul before Acts 13:9, Paul from there on'+(wrong.length?'. WRONG: '+wrong.slice(0,6).map(([c,w,nm])=>'chapter '+c+' says '+nm+', wanted '+w).join(' | '):''))}
  /* the narrator's scroll: every line of narration told in the dark was read from it, and it is down again at the end */
  ok(inked>=80&&SHARED.scroll&&SHARED.scroll.state==='down'&&!SHARED.scroll.over.length,inked+' lines of narration were told in the dark, and each was read from the scroll');
  ok(!unkeyed.size,'every choice that is mixed is mixed by its keys, the same in every language'+(unkeyed.size?'. BY TEXT: '+[...unkeyed].slice(0,6).join(' | '):''));talked();fitVerbs();ok(!tight.size,'no text overflows its box: speech, choices, status line, verbs, top bar'+(tight.size?'. TOO LONG: '+[...tight].slice(0,10).join(' | '):''));
  L('DONE');
 }catch(e){if(e!=='halt')L('ERR '+(e&&e.message||e)+(e&&e.stack?' | '+e.stack.split('\n').slice(1,5).join(' < '):''))}})();
