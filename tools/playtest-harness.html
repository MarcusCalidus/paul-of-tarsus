<!-- Test driver injected into a temporary copy of index.html by tools/playtest.mjs. It plays the game through the real UI. -->
<pre id="tlog" style="position:fixed;left:0;top:0;margin:0;font:11px monospace;color:#0f0;background:rgba(0,0,0,.75);max-width:100%;white-space:pre-wrap;z-index:9"></pre>
<script>
(()=>{const stop=(location.href.match(/stop=(\w+)/)||[])[1]||'final';const L=m=>{$('#tlog').textContent+=m+'\n'};
 let sk=setInterval(()=>{if(G.skip)G.skip()},30);
 G.speedAll=500;
 const idle=async()=>{await wait(120);let n=0;while((G.busy||P.walk)&&n++<4000){if($('#choices').classList.contains('on')||ov.classList.contains('end'))break;await wait(50)}};
 const verb=v=>document.querySelector(`#verbs button[data-v=${v}]`).click();
 const view=(x,y)=>{const r=vp.getBoundingClientRect();vp.dispatchEvent(new MouseEvent('click',{clientX:r.left+(x-G.cam)/320*r.width,clientY:r.top+y/144*r.height,bubbles:true}))};
 const item=id=>{const i=G.inv.indexOf(id);if(i<0)throw new Error('no item '+id);document.querySelectorAll('#inv .slot')[i].click()};
 const hs=name=>{const h=ROOMS[G.room].hs.find(h=>h.name===name&&(!h.vis||h.vis()));if(!h)throw new Error('no hs '+name+' in '+G.room);return[h.x+h.w/2,h.y+h.h/2]};
 const act=async(v,name)=>{if(v)verb(v);view(...hs(name));await idle()};
 const use=async(a,b)=>{verb('use');item(a);item(b);await idle()};
 const useOn=async(a,name,v)=>{verb(v||'use');item(a);view(...hs(name));await idle()};
 const actor=async(v,a)=>{if(v)verb(v);view(a.x,a.y-18);await idle()};
 const choose=async i=>{const b=document.querySelectorAll('#choices button');b[i<0?b.length+i:i].click();await idle()};
 const ok=(c,m)=>L((c?'ok   ':'FAIL ')+m);
 const halt=(name,fn)=>{if(stop===name){clearInterval(sk);L('STOP '+name+' room='+G.room+' inv='+G.inv.join(','));if(fn)fn();throw 'halt'}};
 addEventListener('error',e=>L('JSERR '+e.message));addEventListener('unhandledrejection',e=>{if(e.reason!=='halt')L('REJ '+(e.reason&&e.reason.message||e.reason))});
 (async()=>{try{
  while(!G.ready)await wait(30);
  const srt=()=>G.inv.slice().sort().join(),nq=()=>document.querySelectorAll('#choices button').length;
  const pickQ=async txt=>{const b=[...document.querySelectorAll('#choices button')],i=b.findIndex(x=>x.textContent.includes(txt));if(i<0)throw new Error('no choice '+txt);b[i].click();await idle()};
  const enter=async c=>{$('#code').click();$('#codein').value=c;$('#codego').click();await idle()};
  const give=async(id,a)=>{verb('give');item(id);view(a.x,a.y-18);await idle()};
  /* Chapter Three stops start that chapter from the title screen, without replaying the first two. */
  const C3=/^(tarsus|tent|frame|meeting|court|antioch|potter|quiz3|sealed|loaded|road|final3)$/.test(stop);let n=0;
  halt('title');
  if(stop==='title2'){document.querySelector('#overlay [data-ch="2"]').click();await idle();ok(G.ch===2&&G.room==='jerusalem'&&!G.busy,'title starts chapter two');halt('title2')}
  if(stop==='title3'){document.querySelector('#overlay [data-ch="3"]').click();await idle();ok(G.ch===3&&G.room==='tarsus'&&!G.busy&&ACT.barnabas.x>100,'title starts chapter three');halt('title3')}
  if(stop==='titlecode'){Object.assign(F,{gotAwl:1,gotThread:1,gotKnife:1,gotCloth:1,gotRope:1,gotSkin:1,gotBasket:1,cutCloth:1,longRope:1});G.room='street';
    const c=makeCode();for(const k in F)delete F[k];G.room=null;
    ok($('#code').textContent==='ENTER CODE','title shows ENTER CODE');$('#code').click();
    ok(cb.classList.contains('on')&&!$('#codebox .big'),'title: entry-only screen');
    $('#codein').value=c;$('#codego').click();await idle();
    ok(G.room==='street'&&!G.scene&&!ov.classList.contains('on')&&!G.busy&&has('longrope')&&has('patch')&&has('basket')&&!has('pouch'),'code from title starts mid-game: '+c);
    await act(null,"Eliab's door");ok(G.room==='workshop','playable after title code');halt('titlecode')}
  if(!C3){
  ov.click();await idle();ok(G.room==='workshop'&&!G.busy,'intro ends in workshop');
  halt('workshop',()=>{say(ACT.eliab,'Tonight we lower you from her window. We need a basket that will hold, and a rope that will reach.')});
  halt('walk',()=>{P.speed=4;walk(P,60,130)});
  await act('pickup','large basket');await use('pouch','basket');ok(has('basket')&&has('pouch'),'nonsense combination refused');
  verb('open');item('pouch');await idle();ok(has('awl')&&!has('pouch'),'pouch opens to awl');
  for(const n of['spool of thread',"tentmaker's knife",'bolt of goat-hair cloth','coil of rope','waterskin'])await act('pickup',n);
  ok(['thread','knife','cloth','rope','skin','basket'].every(has),'workshop items collected');
  await use('thread','basket');ok(has('basket')&&!F.strong,'no reinforcing without straps');
  await use('knife','cloth');ok(has('patch')&&has('strips')&&!has('cloth'),'cloth cut');
  await use('strips','rope');ok(has('longrope')&&!has('rope'),'rope lengthened');
  const c1=makeCode(),b1=stateBits(),inv1=srt();
  ok(decode(c1).b===b1&&decode(c1).ch===1&&/^[0-9A-Z]{3}-[0-9A-Z]{3}$/.test(c1)&&$('#code').textContent==='CODE '+c1,'code round-trips: '+c1);
  ok(decode('AAAAAA')===null&&decode('')===null&&decode(c1.slice(0,6)+(c1[6]==='A'?'B':'A'))===null,'bad codes rejected');
  ok(decode(c1.toLowerCase().replace('-',' ')).b===b1,'lower case and spaces accepted');
  await actor(null,ACT.eliab);ok(document.querySelectorAll('#choices button').length===5,'eliab has 5 topics');await choose(3);await choose(-1);
  await actor(null,ACT.eliab);ok(document.querySelectorAll('#choices button').length===4,'once-topic gone');
  halt('choices');await choose(-1);
  halt('pray',()=>{pray()});
  pray();await idle();ok(G.prays===1&&!G.busy,'prayer returns control, hint='+hint()[0]);
  await act(null,'door to the street');ok(G.room==='street','in street');
  await act(null,'alley to the wall quarter');ok(G.room==='street'&&P.x<400,'guard turns Paul back');
  halt('guard',()=>{ACT.guard.dir=1;say(ACT.guard,'Halt! The wall quarter is closed tonight. Orders of the ethnarch.')});
  await actor(null,ACT.zakkai);ok(F.metZakkai,'met merchant');await choose(0);await choose(1);await choose(-1);
  await useOn('skin','well');ok(has('skinfull'),'waterskin filled');
  await actor(null,ACT.guard);verb('give');item('skinfull');view(ACT.guard.x,ACT.guard.y-18);await idle();ok(F.kind&&has('skin'),'water given to guard');
  await useOn('awl','torn awning');ok(F.awning&&has('straps')&&!has('patch'),'awning mended, straps received');
  await use('straps','basket');ok(has('strongbasket'),'basket reinforced');
  const c2=makeCode(),inv2=srt();
  $('#code').click();ok(cb.classList.contains('on')&&$('#codebox .big').textContent===c2,'safe point screen shows '+c2);
  halt('code');
  $('#codein').value='ZZZ-ZZ2';$('#codego').click();ok(cb.classList.contains('on')&&G.room==='street','invalid code refused');
  $('#codein').value=c1;$('#codego').click();await idle();
  ok(G.room==='workshop'&&srt()===inv1&&!G.busy&&!F.awning&&!cb.classList.contains('on'),'code restores workshop state');
  $('#code').click();$('#codein').value=c2;$('#codego').click();await idle();
  ok(G.room==='street'&&srt()===inv2&&F.awning&&F.kind&&!F.water,'code restores street state');
  halt('street',()=>{place(P,'street',300,124,1)});
  await act(null,'alley to the wall quarter');ok(G.room==='house'&&F.inHouse,'reached house');
  await act('open','shutters');ok(!F.shutters,'shutters refused while lamp lit');
  await useOn('strongbasket','shutters');ok(!F.basketOn,'basket refused before rope');
  await act('use','oil lamp');ok(F.lampOut,'lamp out');
  halt('dark');
  await act('open','shutters');ok(F.shutters,'shutters open');
  await useOn('longrope','roof beam');ok(F.ropeTied&&!has('longrope'),'rope tied');
  await actor(null,ACT.naomi);await choose(-1);
  halt('house',()=>{say(P,'Twice around the beam, and a hitch that tightens under load.')});
  halt('descent',()=>{G.scene=CHAP[1].scenes.wall;G.end={heads:1,by:92,rider:1};G.busy=true;lock(true);status();narr('By night the disciples lowered him in a basket through an opening in the city wall. (Acts 9:25)',{dur:9000})});
  await useOn('strongbasket','window');
  n=0;while(!ov.classList.contains('end')&&n++<4000)await wait(50);
  ok(ov.classList.contains('end'),'chapter one complete screen shown');
  ok(/Chapter Two code: 2-/.test(ov.textContent),'chapter one ends with a chapter two code');
  halt('final');
  /* ---------------- Chapter Two ---------------- */
  await wait(1700);ov.click();await idle();ok(G.ch===2&&G.room==='jerusalem'&&!G.busy&&srt()==='awl,knife,thread','chapter two starts in Jerusalem');
  halt('jerusalem',()=>{say(P,'The disciples meet in the upper room of that house. I must try to join them.')});
  ok(/^2-[0-9A-Z]{3}-[0-9A-Z]{3}$/.test(makeCode())&&decode(makeCode()).ch===2,'chapter two code format '+makeCode());
  await act('use','door of the house');ok(F.knocked&&G.room==='jerusalem','door stays shut for Saul');
  await act('use','loose wheel');ok(!F.wheelOn,'wheel needs its owner first');
  await actor(null,ACT.barnabas);ok(F.metBarn,'met the man with the cart');
  await act('pickup','pruned branch');ok(has('stick'),'branch picked up');
  await useOn('stick','handcart');ok(has('stick')&&!F.cartFixed,'raw branch refused');
  await use('knife','stick');ok(has('peg')&&!has('stick'),'peg carved');
  await useOn('peg','handcart');ok(has('peg'),'peg refused before the wheel is on');
  await act('use','loose wheel');ok(F.wheelOn,'wheel lifted together');
  halt('cart',()=>{say(ACT.barnabas,'It is on! But with no pin through the axle, it will roll off again before I reach the corner.')});
  const cj=makeCode();
  verb('use');item('peg');view(...hs('handcart'));await idle();
  ok(nq()===3,'story round 1 offers three answers');
  await pickQ('I acted in ignorance');ok(nq()===2,'self-defending answer is set aside');
  halt('quiz');
  await pickQ('Yes. I persecuted');await pickQ('On the road to Damascus');await pickQ('I spoke in the name of Jesus');
  ok(F.told&&F.cartFixed&&!G.busy&&ACT.barnabas.x>340,'Barnabas believes him and goes to the door');
  const ct=makeCode();await enter(cj);
  ok(G.ch===2&&has('peg')&&F.wheelOn&&!F.told&&ACT.barnabas.x<260,'chapter two code restores earlier state');
  await enter(ct);ok(F.told&&ACT.barnabas.x>340&&!has('peg'),'chapter two code restores later state');
  await act('use','door of the house');ok(G.room==='upper'&&!G.busy,'Barnabas gets him in');
  halt('upper',()=>{say(ACT.cephas,'Stay in my house, brother. We have much to speak about.')});
  await actor(null,ACT.cephas);await choose(0);await choose(-1);await actor(null,ACT.james);await choose(0);await choose(-1);
  pray();await idle();ok(hint()[0]==='upper','upper room hint');
  await act(null,'door to the city');ok(G.room==='harbor'&&has('provisions')&&!G.busy,'brought down to Caesarea');
  halt('harbor',()=>{say(ACT.mattan,'There she is, Saul: the only ship in harbor bound for Cilicia.')});
  await act('use','halyard');ok(!F.sailDown,"rigging needs the captain's word");
  await actor(null,ACT.captain);ok(F.metCapt,'met the captain');
  await act('use','halyard');ok(F.sailDown,'sail lowered');
  await useOn('thread','torn sail');ok(!F.sailMended,'tent thread is too weak');
  await useOn('knife','heap of old sailcloth');ok(has('sailpatch'),'patch cut');
  await useOn('awl','torn sail');ok(!F.sailMended,'no twine yet');
  await actor(null,ACT.fisher);await choose(0);await choose(-1);
  verb('give');item('provisions');view(ACT.fisher.x,ACT.fisher.y-18);await idle();ok(has('twine')&&!has('provisions'),'bread shared, twine given');
  const chb=makeCode();await enter(chb);ok(G.room==='harbor'&&has('twine')&&has('sailpatch')&&F.sailDown&&!has('provisions'),'harbor code restores');
  halt('sail',()=>{place(P,'harbor',330,126,1);say(ACT.captain,'A patch of sound sailcloth, and tarred twine. Not thread: thread parts in the first gust.')});
  halt('sailing',()=>{F.sailMended=1;F.sailUp=1;P.room=null;ACT.captain.room=null;G.ship={ox:50,paul:1,capt:1};G.busy=true;lock(true);status();narr('So the brothers sent him off to Tarsus. (Acts 9:30)',{dur:9000})});
  verb('use');item('awl');view(...hs('torn sail'));
  n=0;while(!/A Friend in Jerusalem/.test(ov.textContent)&&n++<4000)await wait(50);
  ok(ov.classList.contains('end')&&/A Friend in Jerusalem/.test(ov.textContent),'chapter two complete screen shown');
  ok(/Chapter Three code: 3-/.test(ov.textContent),'chapter two ends with a chapter three code');
  halt('final2');await wait(1700)}
  /* ---------------- Chapter Three ---------------- */
  (C3?document.querySelector('#overlay [data-ch="3"]'):ov).click();await idle();ok(G.ch===3&&G.room==='tarsus'&&!G.busy&&srt()==='awl,knife,thread','chapter three starts in Tarsus');
  halt('tarsus',()=>{say(ACT.barnabas,'I have asked for you along every row of tentmakers in this city. And here you are, at the very last stall.')});
  ok(/^3-[0-9A-Z]{3}-[0-9A-Z]{3}$/.test(makeCode())&&decode(makeCode()).ch===3,'chapter three code format '+makeCode());
  await act(null,'east gate');ok(G.room==='tarsus'&&!F.sold&&!G.busy,'no leaving before the promise is kept');
  await act('pickup','tent');ok(!has('tent')&&!F.gotTent,'unfinished tent stays on its frame');
  await actor(null,ACT.kleon);ok(F.metKleon,'met Kleon');await choose(0);await choose(-1);
  await actor(null,ACT.barnabas);ok(nq()===4,'barnabas has 4 topics in Tarsus');await choose(-1);
  await useOn('awl','tent');ok(F.seam&&ACT.barnabas.x<120,'seam sewn with Barnabas holding the edge');
  await useOn('awl','tent');ok(!F.loopsOn,'no loops to sew yet');
  await useOn('knife','leather hide');ok(has('loops')&&F.gotLoops,'peg loops cut from the hide');
  halt('tent',()=>{place(P,'tarsus',182,113,-1);say(P,'One loop at every peg, and each stitched through twice...')});
  const ta=makeCode();
  await useOn('loops','tent');ok(F.loopsOn&&!has('loops'),'loops sewn to the hem');
  await give('awl',ACT.kleon);ok(!F.sold,'Kleon wants his tent, not tools');
  await act('pickup','tent');ok(has('tent')&&F.gotTent,'finished tent rolled up');
  await give('tent',ACT.kleon);ok(F.sold&&!has('tent')&&!G.busy,'tent delivered as promised');
  pray();await idle();ok(hint()[0]==='go3','tarsus hint points to the road');
  const tb=makeCode();await enter(ta);
  ok(G.ch===3&&G.room==='tarsus'&&has('loops')&&F.seam&&!F.loopsOn&&!F.sold&&ACT.barnabas.room==='tarsus','chapter three code restores earlier state');
  await enter(tb);ok(F.sold&&F.gotTent&&!has('tent')&&srt()==='awl,knife,thread','chapter three code restores later state');
  halt('frame',()=>{say(ACT.kleon,'May your road be as sound as your seams, tentmaker.')});
  halt('meeting',()=>{G.meet=1;enterRoom('court',112,126,1);place(ACT.barnabas,'court',86,122,1);place(ACT.lucius,'court',140,118,1);place(ACT.xanthe,'court',62,130,1);place(ACT.theron,'court',40,124,1);place(ACT.agabus,'court',204,118,-1);
    say(ACT.agabus,'A great famine is about to come on the entire inhabited earth.')});
  await act(null,'east gate');
  ok(G.room==='court'&&!G.busy&&srt()==='awl,bolt,knife,wages'&&ACT.barnabas.room==='court'&&ACT.xanthe.room==='antioch','brought to Antioch; a year later, the relief is gathered');
  halt('court',()=>{say(ACT.barnabas,'But it has weeks of road ahead of it, and our old pack bags are rotten through.')});
  await actor(null,ACT.barnabas);await choose(0);await choose(-1);await actor(null,ACT.agabus);await choose(0);await choose(-1);
  await useOn('awl','old pack bags');await useOn('bolt','donkey');ok(!F.bagsOn&&has('bolt'),'loose cloth carries nothing');
  await use('awl','bolt');ok(has('bolt')&&!F.cutBolt,'cloth must be cut before sewing');
  await use('knife','bolt');ok(has('panels')&&!has('bolt'),'panels cut');
  await use('awl','panels');ok(!F.bags&&has('panels'),'no thread, no bags');
  pray();await idle();ok(hint()[0]==='xan3','hint points to Xanthe');
  await act(null,'gate to the street');ok(G.room==='antioch'&&!G.busy,'out in the street');
  halt('antioch',()=>{place(P,'antioch',150,122,1);say(ACT.xanthe,'The others carry in sacks of grain. I earn two small coins a day. What could I give?')});
  halt('potter',()=>{place(P,'antioch',320,124,1);G.cam=160;say(ACT.theron,'My oil jars went to the courtyard at dawn. A potter cannot send much, but he can send it well sealed.')});
  await actor(null,ACT.theron);ok(nq()===5,'theron has 5 topics');await choose(2);await choose(-1);
  await give('wages',ACT.xanthe);ok(has('wages'),'silver is not what Xanthe needs');
  await actor(null,ACT.xanthe);ok(nq()===3,'Xanthe round 1 offers three answers');
  await pickQ('everyone must give');ok(nq()===2&&!F.gotSpool,'pressure is set aside');
  halt('quiz3');
  await pickQ('you are excused');ok(nq()===1,'so is dismissal');
  await pickQ('No one asks for what you do not have');await pickQ('What is in your hands');await pickQ('I could buy it');await pickQ('no bags to travel in');
  ok(has('spool')&&F.gotSpool&&!G.busy,'Xanthe gives her thread gladly');
  await actor(null,ACT.theron);ok(nq()===4,'topic about Xanthe is gone');await choose(-1);
  await use('spool','panels');ok(has('bags')&&!has('panels')&&!has('spool'),'pack bags sewn');
  const tc=makeCode();
  await act('use','south gate');ok(G.room==='antioch','not leaving before the gift is ready');
  await act(null,'gate to the courtyard');ok(G.room==='court'&&P.x>250,'back in the courtyard');
  await give('wages',ACT.lucius);ok(nq()===3&&!has('wages'),'Lucius offers the purse uncounted');
  await pickQ('careful count on the road');ok(nq()===2&&!F.sealed,'a private count is set aside');
  await pickQ('Count it before the brothers');ok(F.sealed&&!has('wages')&&!G.busy&&has('bags'),'gift counted, recorded and sealed');
  const td=makeCode();await enter(tc);ok(G.room==='antioch'&&has('bags')&&has('wages')&&!F.sealed&&ACT.xanthe.room==='antioch','street code restores');
  await enter(td);ok(G.room==='court'&&F.sealed&&has('bags')&&!has('wages')&&ACT.barnabas.room==='court','courtyard code restores');
  pray();await idle();ok(hint()[0]==='load3','courtyard hint');
  halt('sealed',()=>{place(P,'court',232,116,1);say(P,'He cannot carry grain on a bare saddle. He needs pack bags.')});
  halt('loaded',()=>{F.bagsOn=1;F.loaded=1;place(ACT.xanthe,'court',216,128,-1);place(ACT.theron,'court',244,134,-1);place(P,'court',150,126,1);G.inv=CHAP[3].inv('court');drawInv();
    say(ACT.xanthe,'And my thread in every seam of it. I did have something to give.')});
  halt('road',()=>{G.scene=CHAP[3].scenes.road;G.trek={k:.52};G.busy=true;lock(true);status();narr('So they sent the relief to the elders in Judea by the hand of Barnabas and Saul. (Acts 11:30)',{dur:9000})});
  verb('use');item('bags');view(...hs('donkey'));
  n=0;while(!(ov.classList.contains('end')&&/Called to Antioch/.test(ov.textContent))&&n++<4000)await wait(50);
  ok(ov.classList.contains('end')&&/Called to Antioch/.test(ov.textContent),'chapter three complete screen shown');halt('final3');L('DONE');
 }catch(e){if(e!=='halt')L('ERR '+(e&&e.message||e))}})();
})();
</script>
